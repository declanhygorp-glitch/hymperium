<style>
:root{
  --bg:#07040d; --bg2:#0e0818; --card:#120b1f; --card2:#170e28; --ink:#f3ecff; --muted:#a898c4; --line:#2a1c42;
  --brand:#a43dff; --brand2:#7b2bff; --brand-hi:#d58bff; --brand-soft:#a43dff1f; --bad:#ff5d7a; --radius:14px;
  --glow:0 0 18px #a43dff55;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:radial-gradient(1200px 600px at 80% -10%,#2a0e4a55,transparent 60%),var(--bg);background-attachment:fixed;color:var(--ink);font:15px/1.45 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color-scheme:dark}
h1,h2,h3{margin:0;line-height:1.2}
h2{font-size:20px} h3{font-size:16px}
.muted,small{color:var(--muted)}
a{color:var(--brand-hi)}
.num{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.wrap{max-width:1080px;margin:0 auto;padding:20px 16px 60px}
.logo-img{width:34px;height:34px;border-radius:50%;box-shadow:0 0 14px #a43dff88;flex:none}

/* topo */
.top{background:#0b0614ee;border-bottom:1px solid #a43dff55;box-shadow:0 1px 24px #a43dff22;position:sticky;top:0;z-index:5;backdrop-filter:blur(8px)}
.top .in{max-width:1080px;margin:0 auto;padding:10px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.top .logo{font-weight:800;font-size:19px;letter-spacing:.5px;margin-right:auto;display:flex;align-items:center;gap:10px;text-shadow:0 0 12px #a43dff99}
.top nav{display:flex;gap:4px;flex-wrap:wrap}
.top nav button{background:transparent;border:1px solid transparent;color:var(--muted);padding:7px 13px;border-radius:999px;font:inherit;cursor:pointer}
.top nav button:hover{color:var(--ink)}
.top nav button.on{background:var(--brand-soft);border-color:#a43dff66;color:#fff;font-weight:600;box-shadow:var(--glow)}
.top .who{font-size:13px;color:var(--muted)}

/* componentes */
.btn{font:inherit;border:1px solid var(--line);background:var(--card2);color:var(--ink);padding:8px 14px;border-radius:10px;cursor:pointer;transition:border-color .15s,box-shadow .15s}
.btn:hover{border-color:#a43dff88}
.btn.primary{background:linear-gradient(180deg,#b453ff,#7b2bff);border-color:#c27bff;color:#fff;font-weight:700;box-shadow:0 0 16px #a43dff66}
.btn.primary:hover{box-shadow:0 0 24px #a43dffaa}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.big{width:100%;padding:13px;font-size:16px;margin-top:20px}
.btn:disabled{opacity:.5;cursor:default}
.card{background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:var(--radius);padding:16px}
.grid{display:grid;gap:12px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(200px,1fr));margin:14px 0}
.kpi .lbl{font-size:13px;color:var(--muted)}
.kpi .val{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;margin-top:4px}
.kpi.hl{background:linear-gradient(160deg,#3a0f6b,#1a0b30);border-color:#a43dff88;box-shadow:var(--glow)}
.kpi.hl .val{color:#fff;text-shadow:0 0 14px #c06bffaa}
.kpi.hl .lbl{color:#d9c4f7}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row.end{justify-content:flex-end}
.row.between{justify-content:space-between}
.period button{border-radius:999px}
.period button.on{background:var(--brand-soft);border-color:var(--brand);color:#fff;box-shadow:var(--glow)}
input,select{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:#0b0615;color:var(--ink);min-width:0}
input::placeholder{color:#6f6290}
input:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px #a43dff33}
input:disabled{opacity:.6}
input.bad{border-color:var(--bad);background:#2a0d18}
input[type=date]::-webkit-calendar-picker-indicator{filter:invert(.8)}
label{display:block;font-size:13px;color:var(--muted);margin-top:12px;font-weight:600}
label input{display:block;width:100%;margin-top:5px;color:var(--ink);font-size:15px;font-weight:400}
table{width:100%;border-collapse:collapse}
th,td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:600}
tr:last-child td{border-bottom:0}
tfoot td{font-weight:800;border-top:2px solid #a43dff55}
.tblwrap{overflow-x:auto}
.sec{margin-top:18px}
.sec>h3{margin-bottom:10px}
.sub td{background:#0d0818;font-size:14px}
.sub td:first-child{padding-left:26px}
.dayrow td{background:#1b1030}
.tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:999px;background:#2a1c42;color:#cbbbe8;font-weight:500}
.tag.off{background:#3a1220;color:var(--bad)}

.emp{margin-top:12px}

.tag.mg{background:#3a1d00;color:#ffc46b;border:1px solid #7a4a00}
.tag.ch.has{background:color-mix(in srgb,var(--pc) 20%,transparent);border-color:color-mix(in srgb,var(--pc) 60%,transparent);color:color-mix(in srgb,var(--pc) 70%,#fff)}

.kpi.k-green .val{color:#4ade80}
.kpi.k-green small{color:#86efac}
.kpi.k-red{border-color:#ef444455;background:linear-gradient(160deg,#2e1116,var(--card))}
.kpi.k-red .val{color:#f87171}
.kpi.k-red small{color:#fca5a5}
.kpi.k-yellow{border-color:#eab30855;background:linear-gradient(160deg,#2b240c,var(--card))}
.kpi.k-yellow .val{color:#facc15}
.kpi.k-yellow small{color:#fde68a}
.kpi.k-lucro{border-color:#6ee7b7aa;background:linear-gradient(160deg,#0d3b2e,#0a2219);box-shadow:0 0 18px #34d39944}

.kpi.k-lucro .val{color:#a7f3d0;text-shadow:0 0 14px #6ee7b799}
.kpi.k-lucro small{color:#bbf7d0}
.chi{width:16px;height:16px;border-radius:4px;object-fit:cover;vertical-align:-3px;margin-right:5px}
.lk .ic{overflow:hidden}
.lk .ic img{width:100%;height:100%;object-fit:cover}
.imgpick{display:flex;gap:10px;align-items:center;margin-top:6px;flex-wrap:wrap}
.imgprev{width:58px;height:58px;border-radius:14px;border:1px dashed #a43dff77;display:grid;place-items:center;font-size:11px;line-height:1.2;color:var(--muted);overflow:hidden;background:#0b0615;text-align:center}

.pctin{width:78px;text-align:right}
.mgrk{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}

.kpi.hl small{color:#d9c4f7}
.lk .lkname{font-weight:700;font-size:15px;color:var(--ink)}
.lk .amt{margin-top:2px}
.lk .fat{font-size:13px;color:var(--muted);margin-top:2px}
.vc{color:#e2b8ff!important;text-shadow:0 0 10px #a43dff88}
.fold{cursor:pointer;user-select:none}
.fold .chev{display:inline-block;width:16px;color:var(--brand-hi)}
.pname{font-weight:600}
.pname.b{font-weight:800}
.pname.has{color:var(--pc);text-shadow:0 0 10px color-mix(in srgb,var(--pc) 45%,transparent)}
.lk .owner{font-size:12px;margin-top:1px}
.colorpick{display:flex;gap:10px;align-items:center;margin-top:6px;flex-wrap:wrap}
.colorpick input[type=color]{width:46px;height:34px;padding:2px;border-radius:9px;cursor:pointer}
.colorpick .sw{width:22px;height:22px;border-radius:50%;border:2px solid #ffffff33;cursor:pointer;padding:0}

/* login */

.auth-side .brand .logo-img{width:44px;height:44px}
.auth-side .big-logo{width:min(220px,60%);margin:10px 0 0;border-radius:50%;filter:drop-shadow(0 0 30px #a43dffaa)}
.auth-side .hero{margin-top:auto}
.auth-side .hero h2{font-size:34px;color:#fff;line-height:1.12;max-width:440px}
.auth-side .hero h2 span{color:#d58bff;text-shadow:0 0 18px #a43dffcc}
.auth-side .hero p{color:#b9a6dc;max-width:400px;margin:12px 0 0}
.feat{list-style:none;padding:0;margin:24px 0 0;display:grid;gap:10px;max-width:440px}
.feat li{display:flex;gap:12px;align-items:flex-start;background:#ffffff08;border:1px solid #a43dff33;border-radius:12px;padding:12px 14px;font-size:14px}
.feat b{color:#fff;display:block}
.feat .dot{flex:none;width:26px;height:26px;border-radius:8px;background:#a43dff33;border:1px solid #a43dff77;display:grid;place-items:center;font-size:13px;font-weight:800;color:#fff}
.auth-side .foot{font-size:12px;color:#8b7aab;margin-top:auto;position:relative}
.auth-side>*{position:relative;z-index:1}
.auth-side .glow{position:absolute;z-index:0;border-radius:50%;filter:blur(70px);pointer-events:none}
.auth-side .g1{width:420px;height:420px;background:#8b2cff55;top:18%;left:-80px}
.auth-side .g2{width:320px;height:320px;background:#d14bff33;bottom:-60px;right:-60px}
.auth-side .gridbg{position:absolute;inset:0;z-index:0;pointer-events:none;background-image:linear-gradient(#a43dff14 1px,transparent 1px),linear-gradient(90deg,#a43dff14 1px,transparent 1px);background-size:44px 44px;-webkit-mask-image:radial-gradient(circle at 40% 45%,#000 0,transparent 70%);mask-image:radial-gradient(circle at 40% 45%,#000 0,transparent 70%)}
.auth-side .hero{margin:auto 0;display:flex;flex-direction:column;align-items:center;text-align:center}
.auth-side .ring{padding:6px;border-radius:50%;background:conic-gradient(from 200deg,#a43dff,#e9b6ff,#6d1fd6,#a43dff);box-shadow:0 0 60px #a43dff66;margin-bottom:26px}
.auth-side .ring .big-logo{display:block;width:190px;margin:0;border:4px solid #12061f}
.auth-side .eyebrow{font-size:12px;letter-spacing:3px;text-transform:uppercase;color:#c99bff;border:1px solid #a43dff55;background:#a43dff1a;border-radius:99px;padding:5px 14px;margin-bottom:14px}
.auth-side .hero h2{font-size:44px;max-width:none}
.auth-side .hero p{margin:14px auto 0;font-size:16px}

.auth-main{background:radial-gradient(600px 400px at 70% 30%,#2a0d4d55,transparent 70%)}
.auth-box{background:linear-gradient(180deg,#160a2799,#0d061899);border:1px solid #a43dff40;border-radius:22px;padding:34px 30px;box-shadow:0 20px 60px #0008,0 0 40px #a43dff22;backdrop-filter:blur(8px)}
.seg.seg3{grid-template-columns:repeat(3,1fr)}
.seg button{display:flex;align-items:center;justify-content:center;gap:6px;transition:.18s}
.seg button:not(.on):hover{color:#fff;background:#a43dff1f}
.seg .ti{font-size:13px}
.seg.seg3 button{min-width:0;padding:10px 6px;font-size:14px;white-space:nowrap}
@media (max-width:520px){.auth-box{padding:26px 16px;border-radius:18px}.seg.seg3 button{font-size:13px;padding:10px 2px}.seg .ti{display:none}}
.auth-main{display:flex;align-items:center;justify-content:center;padding:36px 20px}
.auth-box{width:100%;max-width:440px}
.auth-box .mob-logo{display:none;width:84px;height:84px;border-radius:50%;margin:0 auto 16px;filter:drop-shadow(0 0 20px #a43dffaa)}
.auth-box h1{font-size:28px}
.auth-box .lead{margin:6px 0 0;color:var(--muted)}
.seg{display:grid;grid-template-columns:1fr 1fr;background:#0b0615;border:1px solid var(--line);border-radius:12px;padding:4px;margin:22px 0 4px}
.seg button{border:0;background:transparent;padding:10px;border-radius:9px;font:inherit;font-weight:700;color:var(--muted);cursor:pointer}
.seg button.on{background:linear-gradient(180deg,#b453ff,#7b2bff);color:#fff;box-shadow:0 0 14px #a43dff77}
.auth-box label input{padding:12px 13px;border-radius:11px}
.pw{position:relative}
.pw input{padding-right:78px}
.eye{position:absolute;right:6px;bottom:7px;border:0;background:transparent;cursor:pointer;color:var(--brand-hi);padding:6px 8px;font:600 13px/1 inherit}
.help{font-size:13px;color:var(--muted);margin-top:16px;text-align:center}
.demo-hint{margin-top:22px;font-size:13px;background:#2a1a00;border:1px solid #6b4a00;border-radius:11px;padding:11px 13px;color:#ffd77a}

@media (max-width:860px){
  .auth{grid-template-columns:1fr}
  .auth-side{display:none}

}

/* visão do funcionário */
.links{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.lk{display:flex;gap:14px;align-items:center}
.lk .ic{flex:none;width:42px;height:42px;border-radius:11px;background:#a43dff26;border:1px solid #a43dff66;color:#e2b8ff;display:grid;place-items:center;font-weight:800}
.lk .tx{font-size:14px;color:var(--muted)}
.lk .tx b{color:var(--ink)}

.wrap,.top .in{max-width:min(1600px,94vw)}

  .top nav button{white-space:nowrap;flex:none}

  .kpis,.kpis.mgrk{grid-template-columns:1fr 1fr;gap:10px}

  .period{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
  .period button{flex:none}
  .period .muted{display:none}
  h2{font-size:18px}
}

/* ===== animações ===== */
html{scroll-behavior:smooth}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.97)}to{opacity:1;transform:none}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes shimmer{to{background-position:-200% 0}}
@keyframes toastin{from{opacity:0;transform:translate(-50%,18px)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{50%{opacity:.45}}
#main.enter>*{animation:rise .6s cubic-bezier(.2,.8,.2,1) both}
#main.enter>*:nth-child(2){animation-delay:.05s} #main.enter>*:nth-child(3){animation-delay:.1s}
#main.enter>*:nth-child(4){animation-delay:.15s} #main.enter>*:nth-child(5){animation-delay:.2s}
#main.enter>*:nth-child(6){animation-delay:.25s} #main.enter>*:nth-child(n+7){animation-delay:.3s}
#main.enter .kpi{animation:pop .55s cubic-bezier(.2,.8,.2,1) both}
#main.enter .kpi:nth-child(2){animation-delay:.08s} #main.enter .kpi:nth-child(3){animation-delay:.16s}
#main.enter .kpi:nth-child(4){animation-delay:.24s} #main.enter .kpi:nth-child(5){animation-delay:.32s}
#main.enter .chart .b{transform-origin:bottom;animation:grow .8s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0) * 22ms + .2s)}
.card{transition:transform .25s ease,border-color .25s,box-shadow .25s}
.card.kpi:hover,.card.lk:hover{transform:translateY(-3px);box-shadow:0 12px 30px #0007,0 0 22px #a43dff33}
.btn{transition:transform .12s,border-color .15s,box-shadow .2s,background .2s}
.btn:active{transform:scale(.96)}
.top nav button{transition:color .2s,background .25s,border-color .25s,box-shadow .25s}
.chart .b{transition:opacity .2s,filter .2s}
.chart .b:hover{filter:brightness(1.25)}
tbody tr td{transition:background .15s}
tbody tr:hover td{background:#ffffff07}
.toast{animation:toastin .35s cubic-bezier(.2,.8,.2,1)}
dialog.modal[open]{animation:pop .3s cubic-bezier(.2,.8,.2,1)}
dialog.modal[open]::backdrop{animation:fadein .25s}
.chev{display:inline-block;transition:transform .25s cubic-bezier(.2,.8,.2,1)}
.open>td>.chev,.open>.head .chev,.fold.open .chev{transform:rotate(90deg)}
tr.show,.reveal{animation:rise .35s cubic-bezier(.2,.8,.2,1) both}
.skel{border-radius:var(--radius);background:linear-gradient(90deg,#160d26 0%,#24163a 50%,#160d26 100%);background-size:200% 100%;animation:shimmer 1.3s linear infinite;border:1px solid var(--line)}
.skel.k{height:92px}.skel.c{height:230px;margin-top:18px}.skel.t{height:24px;width:220px;margin-bottom:14px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}html{scroll-behavior:auto}}

/* painel: por funcionário */
tr.emprow{cursor:pointer}
tr.emprow td:first-child{white-space:nowrap}
tr.emprow .chev{color:var(--brand-hi);width:14px}
.cnt{font-size:12px;color:var(--muted);font-weight:500}
.h3row{display:flex;align-items:center;gap:10px;justify-content:space-between;margin-bottom:10px;flex-wrap:wrap}
.h3row h3{margin:0}

/* funcionários e links (admin) */
.emp .head{cursor:pointer;margin-bottom:0}
.emp .head .chev{color:var(--brand-hi)}
.emp .meta{font-size:13px;color:var(--muted)}
.emp-body{margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}

details.menu{position:relative;display:inline-block}

/* canais do YouTube */

.yt{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto auto;gap:14px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:#0d0818;transition:border-color .2s,transform .2s,box-shadow .2s}

.yt-av{width:44px;height:44px;border-radius:50%;overflow:hidden;background:#a43dff26;border:1px solid #a43dff66;display:grid;place-items:center;font-weight:800;color:#e2b8ff}

.ytst.no{background:#7f1d1d55;color:#fca5a5;border:1px solid #ef444466}

.ytst.bad{background:#3a1220;color:var(--bad);font-weight:500;white-space:normal}

.spin{width:12px;height:12px;border-radius:50%;border:2px solid #e2b8ff55;border-top-color:#e2b8ff;display:inline-block;animation:spin .7s linear infinite}
.yt-acts{display:flex;gap:6px;align-items:center}
.ytfil{display:inline-flex;background:#0b0615;border:1px solid var(--line);border-radius:999px;padding:3px}
.ytfil button{border:0;background:transparent;color:var(--muted);font:inherit;font-size:13px;padding:5px 12px;border-radius:999px;cursor:pointer;transition:background .2s,color .2s}
.ytfil button.on{background:var(--brand-soft);color:#fff;box-shadow:inset 0 0 0 1px #a43dff66}
.ytnote{border-color:#6b4a00;background:#2a1a00;color:#ffd77a}
.ytkpis .kpi{font:inherit;color:inherit;text-align:left;cursor:pointer;position:relative;width:100%;display:flex;flex-direction:column;justify-content:flex-start;align-items:stretch}
.ytkpis .kpi:not(.sel){opacity:.72}
.ytkpis .kpi:hover{opacity:1}

const $ = (s, r = document) => r.querySelector(s);

const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const brl = c => (c / 100).toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
const pct = p => (Math.round(p * 100) / 100).toLocaleString("pt-BR") + "%";
const pad = n => String(n).padStart(2, "0");
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const fromYmd = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const addDays = (s, n) => { const d = fromYmd(s); d.setDate(d.getDate() + n); return ymd(d); };
const today = () => ymd(new Date());
const DIAS = ["dom", "seg", "ter", "qua", "qui", "sex", "sáb"];
const fmtDate = s => { const d = fromYmd(s); return `${pad(d.getDate())}/${pad(d.getMonth() + 1)}/${d.getFullYear()}`; };
const fmtDateDow = s => `${DIAS[fromYmd(s).getDay()]} ${fmtDate(s)}`;
const norm = s => String(s ?? "").normalize("NFD").replace(/[̀-ͯ]/g, "").trim().toLowerCase();
const userKey = s => norm(s).replace(/\s+/g, "");
const USER_RE = /^[a-z0-9._-]{3,30}$/;
const share = (cents, percent) => Math.round(cents * percent / 100);
const monthStart = () => today().slice(0, 8) + "01";
const DEDUCAO_PCT = 25;
/* Impostos e sócios: sempre 25% do faturamento total. Só o admin vê, e sai SÓ do lucro dele:
   a equipe (funcionários e gerentes) ganha sobre o faturamento todo. (A partir de 19/11/2026 o valor é lançado com 15% a menos do painel.) */
const TAXA_ATE = "2026-11-18";
const taxPctFor = () => DEDUCAO_PCT;
const grossFor = amountCents => amountCents;
const taxOf = (amountCents, date) => Math.round(amountCents * taxPctFor(date) / 100);
const netOf = amountCents => amountCents;
const grossOf = x => x.grossCents != null ? x.grossCents : x.amountCents;
const netCentsOf = x => x.netCents != null ? x.netCents : x.amountCents;
const taxCentsOf = x => x.taxCents || 0;
/* Divide o que o link rendeu. P = % do link (definida pelo admin).
   Sem gerente: o funcionário fica com P.
   Com gerente: o funcionário fica com E (definida pelo gerente, 0..P) e o gerente com P - E. */
function splitShares(amountCents, P, mgrId, E) { /* amountCents aqui é a base (depois dos impostos) */
  const team = share(amountCents, P);
  if (!mgrId) return { emp: team, mgr: 0 };
  const emp = Math.min(team, share(amountCents, Math.max(0, Math.min(E || 0, P))));
  return { emp, mgr: team - emp };
}
const sum = (arr, f) => arr.reduce((a, x) => a + f(x), 0);

      if (accounts[username]) throw new Error("Esse nome de usuário já existe.");
      const id = "e" + (++n);
      employees[id] = { empId: id, name, username, active: true, mustChangePassword: true, managerId: mgrId, color: color || "" };
      accounts[username] = { password, role: "employee", empId: id };
    },
    /* gerente cria/edita link de alguém da equipe; a % do link é sempre a % dele na equipe */
    async mgrSaveLink(l, mgrId) {
      const me = employees[mgrId], emp = employees[l.empId];
      if (!me || !me.isManager || !emp || emp.managerId !== mgrId) throw { code: "permission-denied" };
      if (typeof me.teamPercent !== "number") throw new Error("O administrador ainda não definiu a sua % da equipe.");
      const tp = me.teamPercent, id = l.id || "l" + (++n), E = Math.max(0, Math.min(l.empPercent || 0, tp));
      const sa = { ...(l.sameAs ? { sameAs: l.sameAs } : {}), ...(l.fallen ? { fallen: l.fallen } : {}) };
      links[id] = { id, empId: l.empId, name: l.name, channel: l.channel || "", url: l.url || "", percent: tp, active: l.active !== false, icon: l.icon || "", ...sa };
      mgrLinks[id] = { mgrId, empId: l.empId, empName: emp.name, name: l.name, channel: l.channel || "", url: l.url || "", icon: l.icon || "", active: l.active !== false, ownerPercent: tp, empPercent: E, ...sa };
      return id;
    },
    /* gerente: link do próprio gerente (canal dele) */
    async mgrSaveOwnLink(l, mgrId) {
      const me = employees[mgrId]; if (!me || !me.isManager) throw { code: "permission-denied" };
      if (typeof me.teamPercent !== "number") throw new Error("O administrador ainda não definiu a sua % da equipe.");
      const id = l.id || "l" + (++n), sa = { ...(l.sameAs ? { sameAs: l.sameAs } : {}), ...(l.fallen ? { fallen: l.fallen } : {}) };
      links[id] = { id, empId: mgrId, name: l.name, channel: l.channel || "", url: l.url || "", percent: me.teamPercent, active: l.active !== false, icon: l.icon || "", ...sa };
      return id;
    },
    async mgrDeleteLink(l, mgrId, withEarnings) {
      const k = links[l.id]; if (!k || !(k.empId === mgrId || (employees[k.empId] && employees[k.empId].managerId === mgrId))) throw { code: "permission-denied" };
      delete links[l.id]; delete mgrLinks[l.id];
      if (withEarnings) for (const key of Object.keys(earnings)) if (earnings[key].linkId === l.id) delete earnings[key];
    }
  };
}

/* =====================================================================
   BACK-END: FIREBASE
   Dados só do admin:   adminLinks (com a %), adminEarnings (com o total)
   Dados do funcionário: employees/{id}/links (nome e canal)
                         employees/{id}/payouts (só a parte dele)
   Login por usuário: o usuário vira um e-mail interno que nunca recebe
   mensagens; quem digita é só o nome de usuário.
   ===================================================================== */
async function makeFirebaseApi(cfg) {
  const base = `https://www.gstatic.com/firebasejs/${FIREBASE_SDK}/`;
  const [A, AU, FS] = await Promise.all([import(base + "firebase-app.js"), import(base + "firebase-auth.js"), import(base + "firebase-firestore.js")]);
  const app = A.initializeApp(cfg), auth = AU.getAuth(app), db = FS.getFirestore(app);
  const D = (...p) => FS.doc(db, ...p), C = (...p) => FS.collection(db, ...p);
  const domain = cfg.authDomain || `${cfg.projectId}.firebaseapp.com`;
  const emailFor = (username, ver) => `${username}${ver ? "." + ver : ""}@${domain}`;
  let cb = () => {}, busy = false, wantRole = null;

  async function profile(u) {
    const l = await FS.getDoc(D("logins", u.uid));
    if (!l.exists()) throw new Error("Esse usuário não tem acesso ao painel.");
    const L = l.data();
    if (L.role === "admin") return { uid: u.uid, role: "admin", name: L.name || "Administrador", username: L.username || "" };
    const e = await FS.getDoc(D("employees", L.empId));
    if (!e.exists() || e.data().active === false) throw new Error("Sua conta está desativada. Fale com o administrador.");
    const E = e.data();
    return { uid: u.uid, role: "employee", empId: L.empId, name: E.name, username: E.username, mustChangePassword: !!E.mustChangePassword, isManager: !!E.isManager, teamPercent: E.teamPercent };
  }
  async function commitDeletes(refs) {
    for (let i = 0; i < refs.length; i += 400) { const b = FS.writeBatch(db); refs.slice(i, i + 400).forEach(r => b.delete(r)); await b.commit(); }
  }
  /* cria um login num app secundário para não derrubar a sessão do admin */
  async function createAuth(email, password) {
    const sec = A.initializeApp(cfg, "sec-" + Date.now());
    try { const sAuth = AU.getAuth(sec); const uid = (await AU.createUserWithEmailAndPassword(sAuth, email, password)).user.uid; await AU.signOut(sAuth); return uid; }
    finally { await A.deleteApp(sec); }
  }
  return {
    mode: "firebase",
    init(onUser) {
      cb = onUser;
      AU.onAuthStateChanged(auth, async u => {
        if (busy) return;
        if (!u) return cb(null);
        try {
          const p = await profile(u);
          if (!auth.currentUser || auth.currentUser.uid !== u.uid) return;
          if (wantRole && kindOf(p) !== wantRole) { const r = wantRole; wantRole = null; await AU.signOut(auth); return cb(null, roleMsg(r, kindOf(p))); }
          wantRole = null; cb(p);
        } catch (e) { wantRole = null; await AU.signOut(auth); cb(null, msgErro(e)); }
      });
    },
    async needsSetup() { return !(await FS.getDoc(D("config", "setup"))).exists(); },
    async setupAdmin({ name, username, password }) {
      busy = true;
      try {
        const email = emailFor(username); let cred;
        try { cred = await AU.createUserWithEmailAndPassword(auth, email, password); }
        catch (e) { if (e.code === "auth/email-already-in-use") cred = await AU.signInWithEmailAndPassword(auth, email, password); else throw e; }
        const uid = cred.user.uid, b = FS.writeBatch(db);
        b.set(D("config", "setup"), { adminUid: uid, createdAt: Date.now() });
        b.set(D("logins", uid), { role: "admin", name, username });
        b.set(D("usernames", username), { email });
        await b.commit();
        busy = false; cb({ uid, role: "admin", name, username });
      } finally { busy = false; }
    },
    async signIn(username, password, role) {
      const un = await FS.getDoc(D("usernames", username));
      if (!un.exists()) throw { code: "auth/invalid-credential" };
      wantRole = role;
      try { await AU.signInWithEmailAndPassword(auth, un.data().email, password); }
      catch (e) { wantRole = null; throw e; }
    },
    async signOut() { await AU.signOut(auth); },
    async changePassword(current, next) {
      const u = auth.currentUser;
      try { await AU.reauthenticateWithCredential(u, AU.EmailAuthProvider.credential(u.email, current)); }
      catch (e) { throw new Error("A senha atual está incorreta."); }
      await AU.updatePassword(u, next);
    },
    async finishFirstPassword(next) {
      const u = auth.currentUser, l = (await FS.getDoc(D("logins", u.uid))).data();
      await AU.updatePassword(u, next);
      await FS.updateDoc(D("employees", l.empId), { mustChangePassword: false });
    },
    async listEmployees() { return (await FS.getDocs(C("employees"))).docs.map(d => ({ empId: d.id, ...d.data() })); },
    async createEmployee({ name, username, password, color }) {
      if ((await FS.getDoc(D("usernames", username))).exists()) throw new Error("Esse nome de usuário já existe.");
      const email = emailFor(username, Date.now().toString(36)), uid = await createAuth(email, password);
      const ref = FS.doc(C("employees")), b = FS.writeBatch(db);
      b.set(ref, { name, username, active: true, mustChangePassword: true, authUid: uid, color: color || "", createdAt: Date.now() });
      b.set(D("logins", uid), { role: "employee", empId: ref.id });
      b.set(D("usernames", username), { email });
      await b.commit();
    },
    async updateEmployee(id, patch) { await FS.updateDoc(D("employees", id), patch); },
    /* sem e-mail real, a "redefinição" cria um login novo e desliga o antigo */
    async resetEmployeePassword(e, pw) {
      const email = emailFor(e.username, Date.now().toString(36)), uid = await createAuth(email, pw), b = FS.writeBatch(db);
      b.set(D("logins", uid), { role: "employee", empId: e.empId });
      if (e.authUid) b.delete(D("logins", e.authUid));
      b.set(D("usernames", e.username), { email });
      b.update(D("employees", e.empId), { authUid: uid, mustChangePassword: true });
      await b.commit();
    },
    async listLinks() { return (await FS.getDocs(C("adminLinks"))).docs.map(d => ({ id: d.id, ...d.data() })); },
    async saveLink(l) {
      const id = l.id || FS.doc(C("adminLinks")).id, b = FS.writeBatch(db), active = l.active !== false, icon = l.icon || "";
      const sa = { ...(l.sameAs ? { sameAs: l.sameAs } : {}), ...(l.fallen ? { fallen: l.fallen } : {}) };
      b.set(D("adminLinks", id), { empId: l.empId, name: l.name, channel: l.channel || "", url: l.url || "", percent: l.percent, active, icon, ...sa });
      b.set(D("employees", l.empId, "links", id), { name: l.name, channel: l.channel || "", active, icon, ...sa });
      await b.commit(); return id;
    },
    async deleteLink(l, withEarnings) {
      const refs = [D("adminLinks", l.id), D("employees", l.empId, "links", l.id), D("mgrLinks", l.id)];
      if (withEarnings) for (const x of (await FS.getDocs(FS.query(C("adminEarnings"), FS.where("linkId", "==", l.id)))).docs) {
        refs.push(x.ref, D("employees", x.data().empId, "payouts", x.id)); if (x.data().mgrId) refs.push(D("employees", x.data().mgrId, "payouts", x.id + "_g"));
      }
      await commitDeletes(refs);
    },
    async deleteEmployee(e, withEarnings) {
      const refs = [];
      for (const sub of ["links", "payouts"]) for (const d of (await FS.getDocs(C("employees", e.empId, sub))).docs) refs.push(d.ref);
      for (const d of (await FS.getDocs(FS.query(C("adminLinks"), FS.where("empId", "==", e.empId)))).docs) refs.push(d.ref, D("mgrLinks", d.id));
      if (withEarnings) for (const x of (await FS.getDocs(FS.query(C("adminEarnings"), FS.where("empId", "==", e.empId)))).docs) {
        refs.push(x.ref); if (x.data().mgrId) refs.push(D("employees", x.data().mgrId, "payouts", x.id + "_g"));
      }
      const team = (await FS.getDocs(FS.query(C("employees"), FS.where("managerId", "==", e.empId)))).docs;
      if (team.length) { const b = FS.writeBatch(db); team.forEach(t => b.update(t.ref, { managerId: null })); await b.commit(); }
      refs.push(D("usernames", e.username)); if (e.authUid) refs.push(D("logins", e.authUid));
      await commitDeletes(refs);
      await FS.deleteDoc(D("employees", e.empId));
    },
    async mgrRecalcMonth(linkId, mgrId, E) {
      const s = await FS.getDocs(FS.query(C("adminEarnings"), FS.where("mgrId", "==", mgrId), FS.where("linkId", "==", linkId)));
      const docs = s.docs.map(d => ({ id: d.id, ...d.data() })).filter(x => x.date >= monthStart());
      const todo = docs.map(x => { const team = x.shareCents + (x.mgrShareCents || 0), emp = share(netCentsOf(x), E);
        return emp > team || (emp === x.shareCents && x.empPercent === E) ? null : { x, emp, mgr: team - emp }; }).filter(Boolean);
      /* poucos dias por lote, por causa do limite de leituras das regras de segurança */
      for (let i = 0; i < todo.length; i += 5) {
        const b = FS.writeBatch(db);
        for (const { x, emp, mgr } of todo.slice(i, i + 5)) {
          b.update(D("adminEarnings", x.id), { empPercent: E, shareCents: emp, mgrShareCents: mgr, updatedAt: Date.now() });
          b.update(D("employees", x.empId, "payouts", x.id), { shareCents: emp });
          b.update(D("employees", mgrId, "payouts", x.id + "_g"), { shareCents: mgr });
        }
        await b.commit();
      }
      return todo.length;
    },
    async listMgrLinks(mgrId) {

    async setMgrLink(id, data) { if (data) await FS.setDoc(D("mgrLinks", id), data); else await FS.deleteDoc(D("mgrLinks", id)); },
    async setEmpPercent(id, E) { await FS.updateDoc(D("mgrLinks", id), { empPercent: E }); },
    async getEarnings(a, b) {
      const s = await FS.getDocs(FS.query(C("adminEarnings"), FS.where("date", ">=", a), FS.where("date", "<=", b)));
      return s.docs.map(d => ({ id: d.id, ...d.data() }));
    },
    /* grava o lançamento do admin, a parte do funcionário e, se houver gerente, a parte do gerente */
    async writeEarnings(ops) {
      for (let i = 0; i < ops.length; i += 100) {
        const chunk = ops.slice(i, i + 100);
        const prev = await Promise.all(chunk.map(o => FS.getDoc(D("adminEarnings", `${o.date}_${o.linkId}`))));
        const b = FS.writeBatch(db);
        chunk.forEach((o, j) => {
          const id = `${o.date}_${o.linkId}`, ra = D("adminEarnings", id), re = D("employees", o.empId, "payouts", id);
          const old = prev[j].exists() ? prev[j].data() : null;
          if (old && old.mgrId && (o.amountCents == null || old.mgrId !== o.mgrId)) b.delete(D("employees", old.mgrId, "payouts", id + "_g"));
          if (o.amountCents == null) { b.delete(ra); b.delete(re); return; }
          const net = o.amountCents, gross = grossFor(o.amountCents, o.date), sp = splitShares(net, o.percent, o.mgrId, o.empPercent);
          b.set(ra, { date: o.date, linkId: o.linkId, empId: o.empId, amountCents: o.amountCents, taxPercent: taxPctFor(o.date), grossCents: gross, taxCents: taxOf(o.amountCents, o.date), netCents: net, percent: o.percent,
            mgrId: o.mgrId || null, empPercent: o.mgrId ? o.empPercent : null, shareCents: sp.emp, mgrShareCents: sp.mgr, updatedAt: Date.now() });
          b.set(re, { date: o.date, linkId: o.linkId, shareCents: sp.emp });
          if (o.mgrId) b.set(D("employees", o.mgrId, "payouts", id + "_g"), { date: o.date, linkId: o.linkId, shareCents: sp.mgr, team: true });
        });
        await b.commit();

/* ========================= R$ por mil views ========================= */
function rpmLinhas(chs, earn, linkOf) {
  const root = id => { const l = linkOf(id); return l && l.sameAs ? l.sameAs : id; };
  const grp = {}; for (const c of chs) if (c.linkId && c.vh) (grp[root(c.linkId)] || (grp[root(c.linkId)] = [])).push(c);
  const out = [];
  for (const [lid, cs] of Object.entries(grp)) {
    let d0 = null, d1 = null;
    for (const c of cs) { const ds = Object.keys(c.vh).filter(d => d >= addDays(S.start, -1) && d <= S.end).sort(); if (ds.length < 2) continue;
      if (d0 == null || ds[0] > d0) d0 = ds[0]; if (d1 == null || ds[ds.length - 1] < d1) d1 = ds[ds.length - 1]; }
    const l = linkOf(lid);
    if (!d0 || !d1 || d1 <= d0) { out.push({ lid, l, cs, coletando: true }); continue; }
    const views = sum(cs.filter(c => c.vh[d0] != null && c.vh[d1] != null), c => Math.max(0, c.vh[d1] - c.vh[d0]));
    const fat = sum(earn.filter(x => x.linkId === lid && x.date > d0 && x.date <= d1), x => netCentsOf(x));
    out.push({ lid, l, cs, d0, d1, views, fat, rpm: views ? Math.round(fat * 1000 / views) : null });
  }
  return out.sort((a, b) => (b.rpm ?? -1) - (a.rpm ?? -1));
}
function rpmHTML(chs, earn, linkOf, quem) {

    ${L.length > ok.length ? `<p class="muted" style="margin:10px 0 0;font-size:13px">⏳ Coletando as views de ${L.length - ok.length} canal(is). O site guarda as views de cada canal uma vez por dia; com 2 dias guardados já dá para calcular.</p>` : ""}</div>`;

    const Y = S.yt && Date.now() - (S.yt.at || 0) < 10 * 60e3 ? S.yt : await loadYtData(); Y.at = Y.at || Date.now();

const FOLD_VIEWS = { painel: true, meus: true, time: true, pag: false, cofre: false, ytv: false };
function foldKey(card) { const h = card.querySelector("h3"); return "hy_fold_" + S.view + "_" + norm((h && h.textContent || "").replace(/\d[\d.,/]*/g, "").replace(/·.*$/, "")).slice(0, 40); }

function foldApply() {
  if (!(S.view in FOLD_VIEWS)) return;
  const main = $("#main"); if (!main) return;
  let n = 0;
  for (const c of $$("#main .card.sec")) {
    if (c.closest("dialog")) continue;
    if (c.matches(".emp, .pf-head, .fech")) continue;
    let hd = [...c.children].find(x => x.matches("h3") || (x.matches(":not(.fold):not([data-act])") && x.querySelector(":scope > h3")));
    if (!hd) continue; n++;
    if (c.dataset.fold == null) {
      if (hd.matches("h3")) { const w = document.createElement("div"); w.className = "h3row"; hd.replaceWith(w); w.appendChild(hd); hd = w; }
      hd.classList.add("sechd");

  }
  let bar = $("#foldAll", main);
  if (n >= 2 && !bar) { const h = `<span id="foldAll" class="row"><button class="btn sm ghost" data-act="foldAll" data-o="0">👁 Mostrar tudo</button><button class="btn sm ghost" data-act="foldAll" data-o="1">🙈 Ocultar tudo</button></span>`;
    const per = $(".row.period", main); if (per) per.insertAdjacentHTML("beforeend", h); else main.insertAdjacentHTML("afterbegin", `<div class="row end" style="margin:0 0 8px">${h}</div>`); }

async function lerPlanilha(file) {

    if (!window.XLSX) await new Promise((ok, no) => { const s = document.createElement("script"); s.src = "https://cdn.sheetjs.com/xlsx-0.20.3/package/xlsx.full.min.js"; s.onload = ok; s.onerror = () => no(new Error("Não foi possível carregar o leitor de Excel. Salve a planilha como CSV e tente de novo.")); document.head.appendChild(s); });

function montarImportacao(rows) {
  if (!rows.length) throw new Error("A planilha está vazia.");
  const head = rows[0].map(norm), used = new Set();
  const find = keys => { const i = head.findIndex((h, j) => !used.has(j) && keys.some(k => h.includes(k))); if (i >= 0) used.add(i); return i; };
  let cD = find(["data", "date", "dia"]), cC = find(["canal", "channel"]), cV = find(["valor", "ganho", "receita", "rendeu", "total", "amount"]), cL = find(["link", "url", "nome"]), body = rows.slice(1);
  if (cL < 0 || cV < 0) throw new Error("Não achei as colunas Link e Valor na primeira linha da planilha.");
  const idx = {}; const put = (k, l) => { if (k) (idx[k] = idx[k] || []).push(l); };
  for (const l of S.links.filter(l => !l.fallen)) { put("nc|" + norm(l.name) + "|" + norm(l.channel), l); put("n|" + norm(l.name), l); if (l.url) put("u|" + norm(l.url), l); }
  const acc = {}, out = [];
  for (const r of body) {
    const ref = String(r[cL] ?? "").trim(), ch = cC >= 0 ? String(r[cC] ?? "").trim() : "";
    const date = cD < 0 ? S.sheetDate : parseDateAny(r[cD]), v = parseMoney(r[cV]);
    const hit = (ch && idx["nc|" + norm(ref) + "|" + norm(ch)]) || idx["u|" + norm(ref)] || idx["n|" + norm(ref)];
    let err = "";
    if (!ref) err = "sem link"; else if (!date) err = "data inválida"; else if (date > today()) err = "data no futuro"; else if (v == null) err = "valor inválido";
    else if (!hit) err = "link não cadastrado"; else if (hit.length > 1) err = "vários links com esse nome: preencha o canal";
    const show = ch ? `${ref} · ${ch}` : ref;
    if (err) { out.push({ ref: show, date, v, err }); continue; }
    const l = hit[0], k = `${l.id}|${date}`;
    if (acc[k]) acc[k].v += v; else out.push(acc[k] = { ref: show, date, v, l, e: empById(l.empId) });
  }
  return out;
}

/* ========================= leitura de print (OCR) ========================= */
let tessWorker = null, ocrProgress = () => {};
function loadScript(src) { return new Promise((ok, no) => { const s = document.createElement("script"); s.src = src; s.onload = ok; s.onerror = () => no(new Error("Não foi possível carregar o leitor de imagens. Verifique a internet.")); document.head.appendChild(s); }); }
async function getOcrWorker() {
  if (!window.Tesseract) await loadScript("https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js");
  if (!tessWorker) {
    tessWorker = await Tesseract.createWorker("por", 1, { logger: m => ocrProgress(m) });
    await tessWorker.setParameters({ tessedit_pageseg_mode: "6", preserve_interword_spaces: "1" });
  }
  return tessWorker;
}
/* amplia 2x, deixa em tons de cinza e, se o fundo for escuro, inverte as cores */
async function prepImage(file) {
  const img = await createImageBitmap(file), k = img.width < 1600 ? 2 : 1;
  const c = document.createElement("canvas"); c.width = img.width * k; c.height = img.height * k;
  const g = c.getContext("2d"); g.imageSmoothingQuality = "high"; g.drawImage(img, 0, 0, c.width, c.height);
  const d = g.getImageData(0, 0, c.width, c.height), px = d.data; let lum = 0;
  for (let i = 0; i < px.length; i += 4) { const y = 0.299 * px[i] + 0.587 * px[i + 1] + 0.114 * px[i + 2]; px[i] = px[i + 1] = px[i + 2] = y; lum += y; }
  if (lum / (px.length / 4) < 128) for (let i = 0; i < px.length; i += 4) px[i] = px[i + 1] = px[i + 2] = 255 - px[i];
  g.putImageData(d, 0, 0); return c;
}
const ocrKey = s => norm(s).replace(/[^a-z0-9]+/g, " ").replace(/([a-z])(\d)/g, "$1 $2").replace(/\s+/g, " ").trim()
  .replace(/(^| )([0-9oil|]+)$/, (m, a, t) => /\d/.test(t) ? a + t.replace(/o/g, "0").replace(/[il|]/g, "1") : m);
/* cada linha "Nome do link ... R$ 123,45" vira {nome, centavos}.
   Em print de real o valor sempre tem centavos, então os 2 últimos dígitos são os centavos
   (isso corrige quando o leitor perde a vírgula: "R$6326" = R$ 63,26). */
function parseOcrText(text) {
  const out = [];
  for (const raw of String(text).split(/\n/)) {
    const line = raw.replace(/\s+/g, " ").trim();
    const m = line.match(/^(.*?)\bR\s?[$S5§s]\s?([\d][\d.,]*)/) || line.match(/^(.*?[a-zA-Z].*?)\s([\d]{1,3}(?:\.\d{3})*,\d{2})\b/);
    if (!m) continue;
    const digits = m[2].replace(/\D/g, ""); if (!digits) continue;
    const name = m[1].replace(/^[^A-Za-zÀ-ú0-9]+/, "").replace(/^(?:[vV\/|\[\]]{1,3}\s+)/, "").replace(/[\s:;\-–|]+$/, "").trim();
    if (!/[a-zA-Z]/.test(name)) continue;
    out.push({ name, cents: Number(digits) });
  }
  return out;
}
function matchOcr(rows, links) {
  const keyed = links.map(l => ({ l, k: ocrKey(l.name) })).filter(x => x.k);
  return rows.map(r => {
    const k = ocrKey(r.name);
    const hits = keyed.filter(x => k === x.k || k.endsWith(" " + x.k));
    const best = Math.max(0, ...hits.map(h => h.k.length)), top = hits.filter(h => h.k.length === best);
    return { ...r, linkId: top.length === 1 ? top[0].l.id : "", ambiguous: top.length > 1 };
  });
}
async function runOcr(file) {
  if (!file || !/^image\//.test(file.type)) return toast("Envie uma imagem (print).", true);
  const out = $("#ocrOut"); if (!out) return;
  out.innerHTML = `<p id="ocrMsg">Preparando o leitor…</p><div class="prog"><i id="ocrBar"></i></div>`;
  ocrProgress = m => {
    const msg = $("#ocrMsg"), bar = $("#ocrBar"); if (!msg) return;
    if (m.status === "recognizing text") { msg.textContent = "Lendo a print…"; bar.style.width = Math.round(m.progress * 100) + "%"; }
    else { msg.textContent = "Preparando o leitor (só demora na primeira vez)…"; bar.style.width = Math.round((m.progress || 0) * 30) + "%"; }
  };
  try {
    const [w, canvas] = await Promise.all([getOcrWorker(), prepImage(file)]);
    const { data } = await w.recognize(canvas);
    S.ocr = matchOcr(parseOcrText(data.text), S.sheet.map(r => r.link));
    renderOcr();
  } catch (e) { console.error(e); out.innerHTML = `<p class="err">${esc(msgErro(e))}</p>`; }
}
function renderOcr() {
  const out = $("#ocrOut"); if (!out) return;
  if (!S.ocr.length) { out.innerHTML = `<p class="err">Não encontrei valores em R$ nessa imagem. Tente uma print mais nítida, só da lista de links.</p>`; return; }
  const opts = sel => `<option value="">— não lançar —</option>` + S.sheet.map(r => { const e = empById(r.link.empId);
    return `<option value="${r.link.id}" ${sel === r.link.id ? "selected" : ""}>${esc((e ? e.name + " – " : "") + linkLabel(r.link))}</option>`; }).join("");
  const ok = S.ocr.filter(r => r.linkId).length;
  out.innerHTML = `<p><b>${S.ocr.length}</b> valor(es) lidos, <b>${ok}</b> reconhecido(s). Confira os valores e o link de cada linha.</p>
    <div class="tblwrap"><table><thead><tr><th>Lido na print</th><th class="num">Valor (R$)</th><th>Vai para o link</th></tr></thead><tbody>${S.ocr.map((r, i) =>
      `<tr><td>${esc(r.name)}${r.ambiguous ? ` <span class="tag off">mais de um link com esse nome</span>` : !r.linkId ? ` <span class="tag off">não reconhecido</span>` : ""}</td>
        <td class="num"><input class="money" data-ocr-v="${i}" inputmode="decimal" value="${(r.cents / 100).toFixed(2).replace(".", ",")}"></td>
        <td><select data-ocr-l="${i}">${opts(r.linkId)}</select></td></tr>`).join("")}</tbody></table></div>
    <div class="row end" style="margin-top:12px"><small>Os valores vão para ${fmtDateDow(S.sheetDate)}. Depois confira na tabela e clique em “Salvar lançamentos”.</small><button class="btn primary" data-act="ocrAplicar">Colocar na tabela</button></div>`;
}

/* canal caiu: o link nunca fica "pausado".
   - se o mesmo Social Network tem outro canal vivo (reaproveitado), o link e o dinheiro continuam nele; só fica registrado que esse canal caiu;
   - se era o último canal do link, o link fica livre de novo (Mapa de links) e tudo que ele rendeu fica no cofrinho, preso a este registro.
     Quem usar o mesmo Social Network depois começa do zero, num link novo. */
async function setFallen(l, on) {
  const admin = S.user.role === "admin", me = S.user.empId;
  const all = admin ? await api.listLinks() : [...await api.listMgrLinks(me), ...(await api.myLinks(me)).map(x => ({ ...x, empId: me }))];
  const cur = all.find(x => x.id === l.id) || l;
  const save = async (x, patch) => { const full = all.find(y => y.id === x.id) || x;
    if (admin) await api.saveLink({ ...full, ...patch });
    else if (full.empId === me) await api.mgrSaveOwnLink({ ...full, ...patch }, me);
    else await api.mgrSaveLink({ ...full, ...patch, id: full.id }, me); };
  const yts = await api.listYt(admin ? null : me).catch(() => []);
  if (!on) { await save(cur, { active: true, fallen: "" }); for (const y of yts) if (y.linkId === cur.id && y.fallen) await api.saveYt(y.id, { fallen: "" }); S.yt = null; return; }
  const nome = cur.channel || l.channel || "";
  const rootId = cur.sameAs || cur.id, grupo = new Set([rootId, ...all.filter(x => x.sameAs === rootId).map(x => x.id)]);
  let caiuId = cur.id, vivoId = cur.sameAs && !(all.find(x => x.id === cur.sameAs) || {}).fallen ? cur.sameAs : null;
  if (!cur.sameAs) {
    const vivo = all.find(x => x.sameAs === cur.id && !x.fallen && x.active !== false);
    if (vivo) { /* o link (com o dinheiro) passa a ser do canal que está vivo; o registro do outro guarda o canal que caiu */
      await save(cur, { channel: vivo.channel || "", icon: vivo.icon || "" });
      await save(vivo, { channel: nome, icon: cur.icon || "", active: false, fallen: today() });
      caiuId = vivo.id; vivoId = cur.id;
    } else await save(cur, { active: false, fallen: today(), ...(nome && !cur.channel ? { channel: nome } : {}) });
  } else await save(cur, { active: false, fallen: today(), ...(nome && !cur.channel ? { channel: nome } : {}) });
  /* o canal do YouTube que caiu também sai de tudo (Conferir postagem, Canais do YouTube, aviso) */
  const k = x => norm(x || "").replace(/[^a-z0-9]/g, ""), doGrupo = yts.filter(y => grupo.has(y.linkId));
  const porNome = nome ? doGrupo.filter(y => k(y.title) === k(nome)) : [];
  const caiu = porNome.length ? porNome : doGrupo.filter(y => y.linkId === caiuId);
  for (const y of caiu) await api.saveYt(y.id, { linkId: caiuId, fallen: today() });
  for (const y of doGrupo) if (!caiu.includes(y) && y.linkId === caiuId && vivoId) await api.saveYt(y.id, { linkId: vivoId });
  S.yt = null;
}
async function askFallen(l, who, after) {
  const nome = `${l.channel || "o canal"} (${l.name}${who ? " · " + who : ""})`;

async function ytCheck(c, key) {

/* lê o texto colado (ex.: "Social Network 21 - English/United States  Roblox: https://robux.agency/uSwQ4a") */
function mpParse(txt) {

  for (const p of partes) { const m = p.match(/social\s*network\s*(\d+)/i); if (!m) continue;
    const url = (p.match(/https?:\/\/[^\s]+/) || [""])[0], lang = (MP_LANG_NOMES.find(([, re]) => re.test(p)) || [""])[0];
    out.push({ n: +m[1], lang, url }); }

}

/* link morto: os vídeos postados nos últimos MP_DIAS dias, somados, têm menos de MP_MIN_VIEWS views */
const MP_DIAS = 3, MP_MIN_VIEWS = 10000, MP_VALIDADE = 6 * 3600e3, MP_VELHO = 24 * 3600e3;
const mpNum = s => { const m = String(s || "").match(/social\s*network\s*(\d+)/i); return m ? +m[1] : null; };
const MP_CACHE = "hy_v3";
const mpCache = () => { try { return JSON.parse(localStorage.getItem(MP_CACHE) || "{}") || {}; } catch (_) { return {}; } };
const mpCacheSet = (id, v) => { try { const o = mpCache(); o[id] = v; localStorage.setItem(MP_CACHE, JSON.stringify(o)); } catch (_) {} };
/* resultado mais novo do teste de views: o salvo no canal ou o guardado neste aparelho */
const v3Of = (c, cache) => { const a = c.v3, b = (cache || mpCache())[c.id]; return a && b ? (a.at >= b.at ? a : b) : a || b || null; };

/* soma as views dos vídeos postados nos últimos MP_DIAS dias */
async function ytViews3d(c, key) {
  const since = Date.now() - MP_DIAS * 86400e3;
  if (api.mode === "demo") {
    await new Promise(r => setTimeout(r, 300));
    let h = 3; for (const ch of c.id + today()) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
    return { at: Date.now(), views: h % 3 === 0 ? h % 9000 : 10000 + h % 90000, n: 1 + h % 6, best: null };
  }
  if (!key) throw new Error("Falta cadastrar a chave da API do YouTube.");
  let uploads = c.uploads;
  if (!uploads) {
    const q = { part: "snippet,contentDetails" };
    if (c.channelId) q.id = c.channelId; else { const p = parseYtUrl(c.url); if (!p) throw new Error("Endereço do canal inválido."); if (p.id) q.id = p.id; else if (p.handle) q.forHandle = p.handle; else q.forUsername = p.user; }
    const j = await ytGet("channels", q, key), ch = j.items && j.items[0];
    if (!ch) throw new Error("Canal não encontrado. Confira o endereço em Conferir postagem.");
    uploads = ch.contentDetails.relatedPlaylists.uploads;
    const patch = { channelId: ch.id, uploads, thumb: ((ch.snippet.thumbnails || {}).default || {}).url || c.thumb || "" };
    Object.assign(c, patch); api.saveYt(c.id, patch).catch(() => {});
  }
  const pj = await ytGet("playlistItems", { part: "contentDetails", playlistId: uploads, maxResults: "50" }, key);
  const ids = (pj.items || []).filter(it => it.contentDetails.videoPublishedAt && new Date(it.contentDetails.videoPublishedAt).getTime() >= since).map(it => it.contentDetails.videoId);
  let views = 0, best = null;
  for (let i = 0; i < ids.length; i += 50) {
    const vj = await ytGet("videos", { part: "snippet,statistics", id: ids.slice(i, i + 50).join(",") }, key);
    for (const v of vj.items || []) { const n = +((v.statistics || {}).viewCount || 0); views += n; if (!best || n > best.views) best = { id: v.id, title: v.snippet.title || "", views: n }; }
  }
  return { at: Date.now(), views, n: ids.length, best };
}

/* junta a planilha com os links cadastrados e os canais do YouTube; cada canal tem o próprio teste */
function mpBuild() {
  const Y = S.yt, P = id => Y.people.find(p => p.empId === id), cache = mpCache(), now = Date.now();
  const acc = new Map();
  for (const [n, lang, promo] of mpCat()) acc.set("n" + n, { key: "n" + n, n, name: `Social Network ${n}`, lang, promo, links: [] });
  for (const l of (Y.links || []).filter(l => !l.fallen)) {
    const n = mpNum(l.name), k = n != null ? "n" + n : "x" + norm(l.name);
    if (!acc.has(k)) acc.set(k, { key: k, n, name: n != null ? `Social Network ${n}` : l.name, lang: "", promo: "", links: [], extra: true });
    acc.get(k).links.push(l);
  }
  const out = [...acc.values()];
  for (const a of out) {
    a.paused = a.links.filter(l => l.active === false);
    a.lines = [];
    for (const l of a.links.filter(l => l.active !== false)) {
      const p = P(l.empId), chs = Y.chs.filter(c => c.linkId === l.id || (!c.linkId && l.channel && norm(c.title) === norm(l.channel)));
      if (!chs.length) { a.lines.push({ l, p, c: null, name: l.channel || l.name, st: "nochan" }); continue; }
      for (const c of chs) {
        const v = v3Of(c, cache), fresh = v && now - v.at < MP_VELHO;
        const st = S.mpBusy.has(c.id) ? "run" : c.v3err && !fresh ? "err" : !v ? "none" : v.views >= MP_MIN_VIEWS ? "ok" : fresh ? "dead" : "none";
        a.lines.push({ l, p, c, v, name: c.title || l.channel || l.name, st });
      }
    }
    /* gerente: link usado fora da equipe dele aparece só como ocupado, sem dizer quem usa */
    const fora = !a.lines.length && !Y.admin && (Y.taken || []).includes(norm(a.name));
    a.st = fora ? "ocupado" : !a.lines.length ? "livre" : a.lines.some(x => x.st === "dead") ? "morto" : "uso";
  }
  return out.sort((x, y) => (x.n == null) - (y.n == null) || (x.n || 0) - (y.n || 0) || x.name.localeCompare(y.name, "pt-BR"));
}

async function mpRunTest(force) {
  const Y = S.yt; if (!Y || S.mpRun) return;
  if (api.mode !== "demo" && !Y.key) { if (force) toast(Y.admin ? "Cadastre a chave da API do YouTube em Conferir postagem → ⚙ API." : "O administrador ainda precisa ativar o teste (chave da API do YouTube).", true); return; }
  const cache = mpCache(), chs = [...new Map(mpBuild().flatMap(a => a.lines).filter(x => x.c).map(x => [x.c.id, x.c])).values()];
  const ids = chs.filter(c => { const v = v3Of(c, cache); return force || !v || Date.now() - v.at > MP_VALIDADE; }).map(c => c.id).filter(id => !S.mpBusy.has(id));
  if (!ids.length) { if (force) toast("Nenhum canal do YouTube ligado aos links em uso."); return; }
  ids.forEach(id => S.mpBusy.add(id)); S.mpRun = { done: 0, total: ids.length }; renderMapa();
  let fatal = null;
  const one = async id => {
    const c = Y.chs.find(x => x.id === id);
    try {
      if (!c || fatal) return;
      const v3 = await ytViews3d(c, Y.key); c.v3 = v3; delete c.v3err; mpCacheSet(c.id, v3);
      api.saveYt(c.id, { v3 }).catch(() => {});
    } catch (e) { if (c) c.v3err = msgErro(e); if (/cota|chave/i.test(msgErro(e))) fatal = msgErro(e); }
    finally { S.mpBusy.delete(id); if (S.mpRun) S.mpRun.done++; renderMapa(); }
  };
  const queue = [...ids];
  await Promise.all(Array.from({ length: Math.min(3, queue.length) }, async () => { while (queue.length) await one(queue.shift()); }));
  S.mpRun = null; renderMapa();
  if (fatal) toast(fatal, true);
  else if (force) { const n = mpBuild().flatMap(a => a.lines).filter(x => x.st === "dead").length; toast(n ? `${n} ${n === 1 ? "canal morto" : "canais mortos"}.` : "Nenhum canal morto.", n > 0); }
  mpPopup();
}

function renderMapa() {
  const Y = S.yt, main = $("#main"), M = S.mp; if (!Y || !M || !main || S.view !== "mapa") return;
  const admin = S.user.role === "admin", all = mpBuild(), langOf = a => a.lang || "none";
  const lname = k => k === "none" ? "Sem idioma" : MP_LANGS[k][1];
  const lcode = k => k === "none" ? "" : `<span class="lc">${MP_LANGS[k][0]}</span>`;
  /* cada filtro conta já aplicando os outros dois */
  const byLang = (a, L) => L === "all" || langOf(a) === L;
  const linesEmp = (a, E) => E === "all" ? a.lines : a.lines.filter(x => x.l.empId === E);
  const byEmp = (a, E) => E === "all" || linesEmp(a, E).length > 0;
  const byFil = (a, F, E) => { const ls = linesEmp(a, E); return F === "all" || (F === "livre" ? a.st === "livre" : F === "uso" ? ls.length > 0 || (E === "all" && a.st === "ocupado") : ls.some(x => x.st === "dead")); };
  const list = all.filter(a => byLang(a, M.lang) && byEmp(a, M.emp) && byFil(a, M.fil, M.emp));
  const chip = (act, k, on, lbl, n) => `<button class="btn sm${on ? " on" : ""}" data-act="${act}" data-k="${esc(k)}">${lbl}<span class="c">${n}</span></button>`;
  const langs = [...Object.keys(MP_LANGS).filter(k => all.some(a => a.lang === k)), ...(all.some(a => !a.lang) ? ["none"] : [])];
  const people = Y.people.filter(p => all.some(a => a.lines.some(x => x.l.empId === p.empId)));
  const ofLE = (L, E, F) => all.filter(a => byLang(a, L) && byEmp(a, E) && byFil(a, F, E)).length;
  const dot = { ok: `<span class="pill g">✓ vivo</span>`, dead: `<span class="pill r">💀 morto</span>`, none: `<span class="pill y">sem teste</span>`, run: `<span class="pill n"><i class="spin"></i> testando</span>`,
    err: `<span class="pill y">erro no teste</span>`, nochan: `<span class="pill n">sem canal no YouTube</span>` };
  const line = (a, x) => {
    const vtxt = x.c && x.v ? `<b>${fmtNum(x.v.views)}</b> views · ${x.v.n} ${x.v.n === 1 ? "vídeo" : "vídeos"}` : x.st === "err" ? `<span title="${esc(x.c.v3err)}">⚠ ${esc(x.c.v3err)}</span>` : x.st === "nochan" ? `<span>ligue em Conferir postagem</span>` : "—";
    const canGo = x.p && (admin || x.p.empId !== S.user.empId);
    return `<div class="mc ${x.st}"><div class="who">${chPill(x.name, x.l.icon, x.p && x.p.color)}${x.p ? pname(x.p.name, x.p.color) : ""}</div>
      <div class="v">${vtxt}</div><div class="acts">${dot[x.st]}${x.st === "dead" && canGo ? `<button class="btn sm" data-act="mpGo" data-u="${esc(x.p.empId)}" title="Abrir o link para trocar de canal">Reatribuir</button>` : ""}</div></div>`;
  };
  const row = a => {
    const ls = M.fil === "morto" ? linesEmp(a, M.emp).filter(x => x.st === "dead") : linesEmp(a, M.emp);
    const promo = a.promo ? `<a href="${esc(a.promo)}" target="_blank" rel="noopener" title="Link de promoção">${esc(a.promo.replace(/^https?:\/\//, ""))}</a>` : "";
    return `<div class="mr ${a.st}"><div class="mr-n">${esc(a.name)}${promo}</div>
      ${a.st === "ocupado" ? `<div class="row"><span class="pill n">Ocupado</span><span class="note">em uso fora da sua equipe</span></div>`
        : a.st === "livre" ? `<div class="row"><span class="pill g">Disponível</span>${a.paused.length ? `<span class="note">pausado em ${a.paused.map(l => esc(l.channel || l.name)).join(", ")}</span>` : ""}</div>`
        : `<div class="mc-list">${ls.map(x => line(a, x)).join("")}</div>`}</div>`;
  };
  const groups = M.lang === "all" ? langs : [M.lang];
  const blocks = groups.map(g => {
    const items = list.filter(a => langOf(a) === g); if (!items.length) return "";
    const open = !M.closed.has(g), free = items.filter(a => a.st === "livre").length, dead = items.filter(a => a.st === "morto").length;
    return `<div class="card mp-grp${open ? " open" : ""}"><div class="mp-gh" data-act="mpGrp" data-k="${g}"><span class="chev">▸</span>${lcode(g)}<span class="t">${lname(g)}</span>
      <span class="m"><span>${items.length} ${items.length === 1 ? "link" : "links"}</span>${free ? `<span class="g">${free} ${free === 1 ? "disponível" : "disponíveis"}</span>` : ""}${dead ? `<span class="r">${dead} com canal morto</span>` : ""}</span></div>
      ${open ? `<div class="mp-rows">${items.map(row).join("")}</div>` : ""}</div>`;
  }).join("");
  const nFree = all.filter(a => a.st === "livre").length, nDead = all.flatMap(a => a.lines).filter(x => x.st === "dead").length, R = S.mpRun;
  main.innerHTML = `<div class="row between"><h2>Mapa de links</h2><div class="row">
      ${Y.admin ? `<button class="btn sm primary" data-act="mpNovos">+ Adicionar Social Networks</button>` : ""}
      <button class="btn sm ghost" data-act="mpAll" data-o="1">Abrir todos</button><button class="btn sm ghost" data-act="mpAll" data-o="0">Fechar todos</button>
      <button class="btn sm" data-act="mpTest" ${R ? "disabled" : ""} title="Somar de novo as views dos últimos ${MP_DIAS} dias">${R ? `<i class="spin"></i> ${R.done}/${R.total}` : "↻ Testar views"}</button></div></div>
    ${R ? `<div class="prog"><i style="width:${Math.round(R.done / R.total * 100)}%"></i></div>` : ""}
    ${!Y.key && api.mode !== "demo" ? `<div class="card ytnote sec">${Y.admin ? `Para testar as views, falta cadastrar a <b>chave da API do YouTube</b> em <b>Conferir postagem → ⚙ API</b>.` : "O administrador ainda precisa ativar o teste das views (chave da API do YouTube)."}</div>` : ""}
    <div class="card mp-f">
      <div class="mp-bar"><span class="lbl">Idioma</span>${chip("mpLang", "all", M.lang === "all", "Todos", ofLE("all", M.emp, M.fil))}${langs.map(k => chip("mpLang", k, M.lang === k, lcode(k) + lname(k), ofLE(k, M.emp, M.fil))).join("")}</div>
      ${people.length > 1 ? `<div class="mp-bar"><span class="lbl">Funcionário</span>${chip("mpEmp", "all", M.emp === "all", "Todos", ofLE(M.lang, "all", M.fil))}${people.map(p => chip("mpEmp", p.empId, M.emp === p.empId, esc(p.empId === S.user.empId ? "Eu" : p.name), ofLE(M.lang, p.empId, M.fil))).join("")}</div>` : ""}
      <div class="mp-bar"><span class="lbl">Mostrar</span>${[["all", "Tudo"], ["livre", "Só disponíveis"], ["uso", "Só em uso"], ["morto", "Só mortos"]].map(([f, l]) => chip("mpFil", f, M.fil === f, l, ofLE(M.lang, M.emp, f))).join("")}</div>
    </div>
    <div class="mp-sum"><b>${all.length}</b> links · <span class="g">${nFree} disponíveis</span> · ${all.length - nFree} em uso${nDead ? ` · <span class="r">${nDead} ${nDead === 1 ? "canal morto" : "canais mortos"}</span>` : ""}</div>
    ${blocks || `<div class="card empty sec">Nenhum link nesse filtro.</div>`}
    <p class="muted" style="font-size:12px;margin-top:14px">Verde = disponível. <b>Morto</b> = o canal somou menos de ${fmtNum(MP_MIN_VIEWS)} views nos vídeos dos últimos ${MP_DIAS} dias (cada canal é testado separado). O teste roda sozinho ao abrir esta tela, no máximo a cada 6 h.${admin ? "" : " Links usados fora da sua equipe aparecem como ocupados."}</p>`;
}

  async mgrToggleLink(el) {

  /* salvar uma % não mexe nas outras: o que foi digitado e ainda não salvo continua no campo */
  async salvarPct(el) {

      .then(ok => ok && afterTeamChange(S.links.filter(l => empById(l.empId) && empById(l.empId).managerId === e.empId).map(l => l.id), on ? "Agora é gerente." : "Gerente removido."));
  },
  editEmp(el) { const e = empById(el.dataset.u); openForm({ title: "Editar funcionário", fields: [{ name: "name", label: "Nome", value: e.name }, { name: "color", label: "Cor do nome", type: "color", value: e.color || "" }],
    onSubmit: d => api.updateEmployee(e.empId, { name: d.name.trim(), color: safeColor(d.color) }) }).then(ok => ok && viewEquipe()); },
  resetEmp(el) {

      fields: [{ name: "password", label: "Senha provisória", type: "password" }],
      onSubmit: d => { checkNewPassword(d.password); return api.resetEmployeePassword(e, d.password); } }).then(ok => ok && (toast("Senha provisória definida."), viewEquipe()));
  },
  toggleEmp(el) {

document.addEventListener("click", e => {
  for (const d of $$("details.menu[open]")) if (!d.contains(e.target) || (e.target.closest(".pop") && e.target.closest("[data-act]"))) d.open = false;
  const el = e.target.closest("[data-act]"); if (!el) return;
  if (el.tagName === "A") e.preventDefault();
  Promise.resolve(ACT[el.dataset.act](el)).catch(err => toast(msgErro(err), true));
});
document.addEventListener("input", e => {
  if (e.target.matches("input.money[data-k]")) { e.target.classList.remove("filled"); sheetTotals(); }
  if (e.target.matches("input.pctin[data-ml]")) { S.pctDraft = S.pctDraft || {}; S.pctDraft[e.target.dataset.ml] = e.target.value; e.target.classList.toggle("dirty", parsePercent(e.target.value) !== +e.target.dataset.e); }
  if (e.target.matches("input.pctin")) {
    const m = S.myMgrLinks[e.target.dataset.ml], v = parsePercent(e.target.value), out = $(`[data-left="${CSS.escape(e.target.dataset.ml)}"]`);
    if (m && out) out.textContent = v == null || v > m.ownerPercent ? `use de 0% a ${pct(m.ownerPercent)}` : `de ${pct(m.ownerPercent)} · você fica com ${pct(m.ownerPercent - v)}`;
  }
});
document.addEventListener("paste", e => {
  if (!$("#ocrDrop")) return;
  const it = [...(e.clipboardData ? e.clipboardData.items : [])].find(i => i.type.startsWith("image/"));
  if (it) { e.preventDefault(); runOcr(it.getAsFile()); }
});
document.addEventListener("dragover", e => { const d = e.target.closest && e.target.closest("#ocrDrop"); if (d) { e.preventDefault(); d.classList.add("over"); } });
document.addEventListener("dragleave", e => { const d = e.target.closest && e.target.closest("#ocrDrop"); if (d) d.classList.remove("over"); });
document.addEventListener("drop", e => { const d = e.target.closest && e.target.closest("#ocrDrop"); if (d) { e.preventDefault(); d.classList.remove("over"); runOcr(e.dataTransfer.files[0]); } });
document.addEventListener("change", async e => {
  if (e.target.dataset && e.target.dataset.chg === "showTax") {
    try { await api.updateEmployee(e.target.dataset.u, { showTax: e.target.checked }); toast(e.target.checked ? "Ele agora vê o faturamento bruto e os impostos." : "Impostos ocultos para ele."); }
    catch (err) { toast(msgErro(err), true); e.target.checked = !e.target.checked; }
    return;
  }
  if (e.target.dataset && e.target.dataset.chg === "setMgr") {
    const u = e.target.dataset.u;
    try { await api.updateEmployee(u, { managerId: e.target.value || null }); await afterTeamChange(S.links.filter(l => l.empId === u).map(l => l.id), "Equipe atualizada."); } catch (err) { toast(msgErro(err), true); }
    return;
  }
  if (e.target.id === "ocrFile" && e.target.files[0]) { runOcr(e.target.files[0]); e.target.value = ""; return; }
  if (e.target.id === "sheetDate" && e.target.value) { S.sheetDate = e.target.value > today() ? today() : e.target.value; viewLancar(); }
  if (e.target.id === "impFile" && e.target.files[0]) {
    try { S.imp = await lerPlanilha(e.target.files[0]); renderImport(); } catch (err) { $("#impOut").innerHTML = `<p class="err">${esc(msgErro(err))}</p>`; }
  }
});
/* A pré-visualização do app bloqueia o envio de formulários, então
   os botões e a tecla Enter chamam esta função diretamente. */
const AUTH_FORMS = ["fLogin", "fSetup", "fFirst"];
document.addEventListener("submit", e => { if (AUTH_FORMS.includes(e.target.id)) { e.preventDefault(); enviarAuth(e.target); } });
document.addEventListener("keydown", e => {
  const f = e.target.closest && e.target.closest("form");
  if (e.key === "Enter" && f && AUTH_FORMS.includes(f.id) && e.target.tagName === "INPUT") { e.preventDefault(); enviarAuth(f); }
});
let enviando = false;
async function enviarAuth(f) {
  if (enviando) return;
  const d = Object.fromEntries(new FormData(f)), btn = $("button.primary", f);
  enviando = true; btn.disabled = true; S.loginErr = "";
  try {
    checkRequired(f);
    if (f.id === "fLogin") { S.loginUser = d.username; await api.signIn(userKey(d.username), d.password, S.loginTab); }
    else if (f.id === "fSetup") {
      const username = d.username.trim().toLowerCase();
      if (!USER_RE.test(username)) throw new Error("Usuário inválido: use de 3 a 30 letras, números, ponto, hífen ou _, sem espaços nem acentos.");
      checkNewPassword(d.password, d.confirm);
      await api.setupAdmin({ name: d.name.trim(), username, password: d.password }); S.setup = false;
    } else {
      checkNewPassword(d.password, d.confirm);
      await api.finishFirstPassword(d.password); S.user.mustChangePassword = false; toast("Senha criada. Bem-vindo!"); render();
    }
  } catch (err) { S.loginErr = msgErro(err); render(); }
  finally { enviando = false; if (document.contains(btn)) btn.disabled = false; }
}

/* ========================= início ========================= */
(async function start() {
  document.title = NOME_DO_SITE;
  try {
    api = wrapCache(wrapHist(FIREBASE_CONFIG ? await makeFirebaseApi(FIREBASE_CONFIG) : makeDemoApi()));
    if (api.mode === "firebase") S.setup = await api.needsSetup();
  } catch (e) {
    console.error(e); $("#app").innerHTML = `<div class="wrap"><div class="card"><b>Não foi possível conectar ao Firebase.</b><p class="err">${esc(msgErro(e))}</p></div></div>`; return;
  }
  api.init((user, err) => {
    S.user = user;
    if (err !== undefined) S.loginErr = err;
    if (user) { S.loginErr = ""; S.setup = false; }
    render();
  });
})();
