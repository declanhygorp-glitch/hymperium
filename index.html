<style>
:root{
  --bg:#07040d; --bg2:#0e0818; --card:#120b1f; --card2:#170e28; --ink:#f3ecff; --muted:#a898c4; --line:#2a1c42;
  --brand:#a43dff; --brand2:#7b2bff; --brand-hi:#d58bff; --brand-soft:#a43dff1f; --bad:#ff5d7a; --radius:14px;
  --glow:0 0 18px #a43dff55;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:radial-gradient(1200px 600px at 80% -10%,#2a0e4a55,transparent 60%),var(--bg);background-attachment:fixed;color:var(--ink);font:15px/1.45 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color-scheme:dark}
h1,h2,h3{margin:0;line-height:1.2}
h2{font-size:20px} h3{font-size:16px}
.muted,small{color:var(--muted)}
a{color:var(--brand-hi)}
.num{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.wrap{max-width:1080px;margin:0 auto;padding:20px 16px 60px}
.logo-img{width:34px;height:34px;border-radius:50%;box-shadow:0 0 14px #a43dff88;flex:none}

/* topo */
.top{background:#0b0614ee;border-bottom:1px solid #a43dff55;box-shadow:0 1px 24px #a43dff22;position:sticky;top:0;z-index:5;backdrop-filter:blur(8px)}
.top .in{max-width:1080px;margin:0 auto;padding:10px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.top .logo{font-weight:800;font-size:19px;letter-spacing:.5px;margin-right:auto;display:flex;align-items:center;gap:10px;text-shadow:0 0 12px #a43dff99}
.top nav{display:flex;gap:4px;flex-wrap:wrap}
.top nav button{background:transparent;border:1px solid transparent;color:var(--muted);padding:7px 13px;border-radius:999px;font:inherit;cursor:pointer}
.top nav button:hover{color:var(--ink)}
.top nav button.on{background:var(--brand-soft);border-color:#a43dff66;color:#fff;font-weight:600;box-shadow:var(--glow)}
.top .who{font-size:13px;color:var(--muted)}

/* componentes */
.btn{font:inherit;border:1px solid var(--line);background:var(--card2);color:var(--ink);padding:8px 14px;border-radius:10px;cursor:pointer;transition:border-color .15s,box-shadow .15s}
.btn:hover{border-color:#a43dff88}
.btn.primary{background:linear-gradient(180deg,#b453ff,#7b2bff);border-color:#c27bff;color:#fff;font-weight:700;box-shadow:0 0 16px #a43dff66}
.btn.primary:hover{box-shadow:0 0 24px #a43dffaa}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.big{width:100%;padding:13px;font-size:16px;margin-top:20px}
.btn:disabled{opacity:.5;cursor:default}
.card{background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:var(--radius);padding:16px}
.grid{display:grid;gap:12px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(200px,1fr));margin:14px 0}
.kpi .lbl{font-size:13px;color:var(--muted)}
.kpi .val{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;margin-top:4px}
.kpi.hl{background:linear-gradient(160deg,#3a0f6b,#1a0b30);border-color:#a43dff88;box-shadow:var(--glow)}
.kpi.hl .val{color:#fff;text-shadow:0 0 14px #c06bffaa}
.kpi.hl .lbl{color:#d9c4f7}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row.end{justify-content:flex-end}
.row.between{justify-content:space-between}
.period button{border-radius:999px}
.period button.on{background:var(--brand-soft);border-color:var(--brand);color:#fff;box-shadow:var(--glow)}
input,select{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:#0b0615;color:var(--ink);min-width:0}
input::placeholder{color:#6f6290}
input:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px #a43dff33}
input:disabled{opacity:.6}
input.bad{border-color:var(--bad);background:#2a0d18}
input[type=date]::-webkit-calendar-picker-indicator{filter:invert(.8)}
label{display:block;font-size:13px;color:var(--muted);margin-top:12px;font-weight:600}
label input{display:block;width:100%;margin-top:5px;color:var(--ink);font-size:15px;font-weight:400}
table{width:100%;border-collapse:collapse}
th,td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:600}
tr:last-child td{border-bottom:0}
tfoot td{font-weight:800;border-top:2px solid #a43dff55}
.tblwrap{overflow-x:auto}
.sec{margin-top:18px}
.sec>h3{margin-bottom:10px}
.sub td{background:#0d0818;font-size:14px}
.sub td:first-child{padding-left:26px}
.dayrow td{background:#1b1030}
.tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:999px;background:#2a1c42;color:#cbbbe8;font-weight:500}
.tag.off{background:#3a1220;color:var(--bad)}

.emp{margin-top:12px}

.tag.mg{background:#3a1d00;color:#ffc46b;border:1px solid #7a4a00}
.tag.ch.has{background:color-mix(in srgb,var(--pc) 20%,transparent);border-color:color-mix(in srgb,var(--pc) 60%,transparent);color:color-mix(in srgb,var(--pc) 70%,#fff)}

.kpi.k-green .val{color:#4ade80}
.kpi.k-green small{color:#86efac}
.kpi.k-red{border-color:#ef444455;background:linear-gradient(160deg,#2e1116,var(--card))}
.kpi.k-red .val{color:#f87171}
.kpi.k-red small{color:#fca5a5}
.kpi.k-yellow{border-color:#eab30855;background:linear-gradient(160deg,#2b240c,var(--card))}
.kpi.k-yellow .val{color:#facc15}
.kpi.k-yellow small{color:#fde68a}
.kpi.k-lucro{border-color:#6ee7b7aa;background:linear-gradient(160deg,#0d3b2e,#0a2219);box-shadow:0 0 18px #34d39944}

.kpi.k-lucro .val{color:#a7f3d0;text-shadow:0 0 14px #6ee7b799}
.kpi.k-lucro small{color:#bbf7d0}
.chi{width:16px;height:16px;border-radius:4px;object-fit:cover;vertical-align:-3px;margin-right:5px}
.lk .ic{overflow:hidden}
.lk .ic img{width:100%;height:100%;object-fit:cover}
.imgpick{display:flex;gap:10px;align-items:center;margin-top:6px;flex-wrap:wrap}
.imgprev{width:58px;height:58px;border-radius:14px;border:1px dashed #a43dff77;display:grid;place-items:center;font-size:11px;line-height:1.2;color:var(--muted);overflow:hidden;background:#0b0615;text-align:center}

.pctin{width:78px;text-align:right}
.mgrk{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}

.kpi.hl small{color:#d9c4f7}
.lk .lkname{font-weight:700;font-size:15px;color:var(--ink)}
.lk .amt{margin-top:2px}
.lk .fat{font-size:13px;color:var(--muted);margin-top:2px}
.vc{color:#e2b8ff!important;text-shadow:0 0 10px #a43dff88}
.fold{cursor:pointer;user-select:none}
.fold .chev{display:inline-block;width:16px;color:var(--brand-hi)}
.pname{font-weight:600}
.pname.b{font-weight:800}
.pname.has{color:var(--pc);text-shadow:0 0 10px color-mix(in srgb,var(--pc) 45%,transparent)}
.lk .owner{font-size:12px;margin-top:1px}
.colorpick{display:flex;gap:10px;align-items:center;margin-top:6px;flex-wrap:wrap}
.colorpick input[type=color]{width:46px;height:34px;padding:2px;border-radius:9px;cursor:pointer}
.colorpick .sw{width:22px;height:22px;border-radius:50%;border:2px solid #ffffff33;cursor:pointer;padding:0}

/* login */

.auth-side .brand .logo-img{width:44px;height:44px}
.auth-side .big-logo{width:min(220px,60%);margin:10px 0 0;border-radius:50%;filter:drop-shadow(0 0 30px #a43dffaa)}
.auth-side .hero{margin-top:auto}
.auth-side .hero h2{font-size:34px;color:#fff;line-height:1.12;max-width:440px}
.auth-side .hero h2 span{color:#d58bff;text-shadow:0 0 18px #a43dffcc}
.auth-side .hero p{color:#b9a6dc;max-width:400px;margin:12px 0 0}
.feat{list-style:none;padding:0;margin:24px 0 0;display:grid;gap:10px;max-width:440px}
.feat li{display:flex;gap:12px;align-items:flex-start;background:#ffffff08;border:1px solid #a43dff33;border-radius:12px;padding:12px 14px;font-size:14px}
.feat b{color:#fff;display:block}
.feat .dot{flex:none;width:26px;height:26px;border-radius:8px;background:#a43dff33;border:1px solid #a43dff77;display:grid;place-items:center;font-size:13px;font-weight:800;color:#fff}
.auth-side .foot{font-size:12px;color:#8b7aab;margin-top:auto;position:relative}
.auth-side>*{position:relative;z-index:1}
.auth-side .glow{position:absolute;z-index:0;border-radius:50%;filter:blur(70px);pointer-events:none}
.auth-side .g1{width:420px;height:420px;background:#8b2cff55;top:18%;left:-80px}
.auth-side .g2{width:320px;height:320px;background:#d14bff33;bottom:-60px;right:-60px}
.auth-side .gridbg{position:absolute;inset:0;z-index:0;pointer-events:none;background-image:linear-gradient(#a43dff14 1px,transparent 1px),linear-gradient(90deg,#a43dff14 1px,transparent 1px);background-size:44px 44px;-webkit-mask-image:radial-gradient(circle at 40% 45%,#000 0,transparent 70%);mask-image:radial-gradient(circle at 40% 45%,#000 0,transparent 70%)}
.auth-side .hero{margin:auto 0;display:flex;flex-direction:column;align-items:center;text-align:center}
.auth-side .ring{padding:6px;border-radius:50%;background:conic-gradient(from 200deg,#a43dff,#e9b6ff,#6d1fd6,#a43dff);box-shadow:0 0 60px #a43dff66;margin-bottom:26px}
.auth-side .ring .big-logo{display:block;width:190px;margin:0;border:4px solid #12061f}
.auth-side .eyebrow{font-size:12px;letter-spacing:3px;text-transform:uppercase;color:#c99bff;border:1px solid #a43dff55;background:#a43dff1a;border-radius:99px;padding:5px 14px;margin-bottom:14px}
.auth-side .hero h2{font-size:44px;max-width:none}
.auth-side .hero p{margin:14px auto 0;font-size:16px}

.auth-main{background:radial-gradient(600px 400px at 70% 30%,#2a0d4d55,transparent 70%)}
.auth-box{background:linear-gradient(180deg,#160a2799,#0d061899);border:1px solid #a43dff40;border-radius:22px;padding:34px 30px;box-shadow:0 20px 60px #0008,0 0 40px #a43dff22;backdrop-filter:blur(8px)}
.seg.seg3{grid-template-columns:repeat(3,1fr)}
.seg button{display:flex;align-items:center;justify-content:center;gap:6px;transition:.18s}
.seg button:not(.on):hover{color:#fff;background:#a43dff1f}
.seg .ti{font-size:13px}
.seg.seg3 button{min-width:0;padding:10px 6px;font-size:14px;white-space:nowrap}
@media (max-width:520px){.auth-box{padding:26px 16px;border-radius:18px}.seg.seg3 button{font-size:13px;padding:10px 2px}.seg .ti{display:none}}
.auth-main{display:flex;align-items:center;justify-content:center;padding:36px 20px}
.auth-box{width:100%;max-width:440px}
.auth-box .mob-logo{display:none;width:84px;height:84px;border-radius:50%;margin:0 auto 16px;filter:drop-shadow(0 0 20px #a43dffaa)}
.auth-box h1{font-size:28px}
.auth-box .lead{margin:6px 0 0;color:var(--muted)}
.seg{display:grid;grid-template-columns:1fr 1fr;background:#0b0615;border:1px solid var(--line);border-radius:12px;padding:4px;margin:22px 0 4px}
.seg button{border:0;background:transparent;padding:10px;border-radius:9px;font:inherit;font-weight:700;color:var(--muted);cursor:pointer}
.seg button.on{background:linear-gradient(180deg,#b453ff,#7b2bff);color:#fff;box-shadow:0 0 14px #a43dff77}
.auth-box label input{padding:12px 13px;border-radius:11px}
.pw{position:relative}
.pw input{padding-right:78px}
.eye{position:absolute;right:6px;bottom:7px;border:0;background:transparent;cursor:pointer;color:var(--brand-hi);padding:6px 8px;font:600 13px/1 inherit}
.help{font-size:13px;color:var(--muted);margin-top:16px;text-align:center}
.demo-hint{margin-top:22px;font-size:13px;background:#2a1a00;border:1px solid #6b4a00;border-radius:11px;padding:11px 13px;color:#ffd77a}

@media (max-width:860px){
  .auth{grid-template-columns:1fr}
  .auth-side{display:none}

}

/* visão do funcionário */
.links{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.lk{display:flex;gap:14px;align-items:center}
.lk .ic{flex:none;width:42px;height:42px;border-radius:11px;background:#a43dff26;border:1px solid #a43dff66;color:#e2b8ff;display:grid;place-items:center;font-weight:800}
.lk .tx{font-size:14px;color:var(--muted)}
.lk .tx b{color:var(--ink)}

.wrap,.top .in{max-width:min(1600px,94vw)}

  .top nav button{white-space:nowrap;flex:none}

  .kpis,.kpis.mgrk{grid-template-columns:1fr 1fr;gap:10px}

  .period{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
  .period button{flex:none}
  .period .muted{display:none}
  h2{font-size:18px}
}

/* ===== animações ===== */
html{scroll-behavior:smooth}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.97)}to{opacity:1;transform:none}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes shimmer{to{background-position:-200% 0}}
@keyframes toastin{from{opacity:0;transform:translate(-50%,18px)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{50%{opacity:.45}}
#main.enter>*{animation:rise .6s cubic-bezier(.2,.8,.2,1) both}
#main.enter>*:nth-child(2){animation-delay:.05s} #main.enter>*:nth-child(3){animation-delay:.1s}
#main.enter>*:nth-child(4){animation-delay:.15s} #main.enter>*:nth-child(5){animation-delay:.2s}
#main.enter>*:nth-child(6){animation-delay:.25s} #main.enter>*:nth-child(n+7){animation-delay:.3s}
#main.enter .kpi{animation:pop .55s cubic-bezier(.2,.8,.2,1) both}
#main.enter .kpi:nth-child(2){animation-delay:.08s} #main.enter .kpi:nth-child(3){animation-delay:.16s}
#main.enter .kpi:nth-child(4){animation-delay:.24s} #main.enter .kpi:nth-child(5){animation-delay:.32s}
#main.enter .chart .b{transform-origin:bottom;animation:grow .8s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0) * 22ms + .2s)}
.card{transition:transform .25s ease,border-color .25s,box-shadow .25s}
.card.kpi:hover,.card.lk:hover{transform:translateY(-3px);box-shadow:0 12px 30px #0007,0 0 22px #a43dff33}
.btn{transition:transform .12s,border-color .15s,box-shadow .2s,background .2s}
.btn:active{transform:scale(.96)}
.top nav button{transition:color .2s,background .25s,border-color .25s,box-shadow .25s}
.chart .b{transition:opacity .2s,filter .2s}
.chart .b:hover{filter:brightness(1.25)}
tbody tr td{transition:background .15s}
tbody tr:hover td{background:#ffffff07}
.toast{animation:toastin .35s cubic-bezier(.2,.8,.2,1)}
dialog.modal[open]{animation:pop .3s cubic-bezier(.2,.8,.2,1)}
dialog.modal[open]::backdrop{animation:fadein .25s}
.chev{display:inline-block;transition:transform .25s cubic-bezier(.2,.8,.2,1)}
.open>td>.chev,.open>.head .chev,.fold.open .chev{transform:rotate(90deg)}
tr.show,.reveal{animation:rise .35s cubic-bezier(.2,.8,.2,1) both}
.skel{border-radius:var(--radius);background:linear-gradient(90deg,#160d26 0%,#24163a 50%,#160d26 100%);background-size:200% 100%;animation:shimmer 1.3s linear infinite;border:1px solid var(--line)}
.skel.k{height:92px}.skel.c{height:230px;margin-top:18px}.skel.t{height:24px;width:220px;margin-bottom:14px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}html{scroll-behavior:auto}}

/* painel: por funcionário */
tr.emprow{cursor:pointer}
tr.emprow td:first-child{white-space:nowrap}
tr.emprow .chev{color:var(--brand-hi);width:14px}
.cnt{font-size:12px;color:var(--muted);font-weight:500}
.h3row{display:flex;align-items:center;gap:10px;justify-content:space-between;margin-bottom:10px;flex-wrap:wrap}
.h3row h3{margin:0}

/* funcionários e links (admin) */
.emp .head{cursor:pointer;margin-bottom:0}
.emp .head .chev{color:var(--brand-hi)}
.emp .meta{font-size:13px;color:var(--muted)}
.emp-body{margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}

details.menu{position:relative;display:inline-block}

/* canais do YouTube */

.yt{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto auto;gap:14px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:#0d0818;transition:border-color .2s,transform .2s,box-shadow .2s}

.yt-av{width:44px;height:44px;border-radius:50%;overflow:hidden;background:#a43dff26;border:1px solid #a43dff66;display:grid;place-items:center;font-weight:800;color:#e2b8ff}

.ytst.no{background:#7f1d1d55;color:#fca5a5;border:1px solid #ef444466}

.ytst.bad{background:#3a1220;color:var(--bad);font-weight:500;white-space:normal}

.spin{width:12px;height:12px;border-radius:50%;border:2px solid #e2b8ff55;border-top-color:#e2b8ff;display:inline-block;animation:spin .7s linear infinite}
.yt-acts{display:flex;gap:6px;align-items:center}
.ytfil{display:inline-flex;background:#0b0615;border:1px solid var(--line);border-radius:999px;padding:3px}
.ytfil button{border:0;background:transparent;color:var(--muted);font:inherit;font-size:13px;padding:5px 12px;border-radius:999px;cursor:pointer;transition:background .2s,color .2s}
.ytfil button.on{background:var(--brand-soft);color:#fff;box-shadow:inset 0 0 0 1px #a43dff66}
.ytnote{border-color:#6b4a00;background:#2a1a00;color:#ffd77a}
.ytkpis .kpi{font:inherit;color:inherit;text-align:left;cursor:pointer;position:relative;width:100%;display:flex;flex-direction:column;justify-content:flex-start;align-items:stretch}
.ytkpis .kpi:not(.sel){opacity:.72}
.ytkpis .kpi:hover{opacity:1}
.ytkpis .kpi.sel{opacity:1;outline:2px solid #c084fc;outline-offset:2px;box-shadow:0 0 0 4px #a43dff22,0 10px 30px #0007}
.ytkpis .kpi.k-green.sel{outline-color:#4ade80}.ytkpis .kpi.k-red.sel{outline-color:#f87171}
.filtag{position:absolute;top:10px;right:12px;font-size:11px;color:var(--muted);background:#ffffff0d;border-radius:99px;padding:2px 8px}
.ytlinks{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 12px}
.ytvemp .head{flex-wrap:wrap}
.ytvchips{display:flex;gap:6px;flex-wrap:wrap}
.ytvchip{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);background:#ffffff08;border:1px solid var(--line);border-radius:99px;padding:3px 9px 3px 3px}
.ytvchip img{width:18px;height:18px;border-radius:50%}
.ytvch{padding:14px 0;border-top:1px solid var(--line)}
.ytvch:first-child{border-top:0;padding-top:0}
.ytvh{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:14px;align-items:center}
.ytvstats{display:flex;gap:18px;flex-wrap:wrap}
.ytvstats div{display:flex;flex-direction:column;align-items:flex-end}
.ytvstats b{font-size:16px;font-variant-numeric:tabular-nums}
.ytvstats small{font-size:11px;color:var(--muted)}
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px;margin-top:14px}
.vid{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;border-radius:12px;padding:8px;border:1px solid transparent;transition:background .2s,border-color .2s,transform .2s}
.vid:hover{background:#ffffff08;border-color:#a43dff55;transform:translateY(-3px)}
.vid:focus-visible{outline:2px solid var(--brand)}
.vth{position:relative;aspect-ratio:16/9;border-radius:10px;overflow:hidden;background:#1a1030}
.vth img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .35s}
.vid:hover .vth img{transform:scale(1.05)}
.vph{width:100%;height:100%;background:linear-gradient(135deg,#2b1250,#120a20)}
.vth .play{position:absolute;inset:0;display:grid;place-items:center;font-size:26px;color:#fff;opacity:0;background:#0006;transition:opacity .2s}
.vid:hover .play{opacity:1}
.vth .dur{position:absolute;right:6px;bottom:6px;background:#000c;color:#fff;font-size:11px;font-weight:700;padding:2px 6px;border-radius:5px}
.vth .last{position:absolute;left:6px;top:6px;background:linear-gradient(135deg,#a43dff,#7c1fff);color:#fff;font-size:11px;font-weight:800;padding:3px 8px;border-radius:6px;box-shadow:0 0 12px #a43dff88}
.vth .last.live{left:auto;right:6px;background:#dc2626}
.vt{font-weight:600;font-size:14px;line-height:1.3;margin-top:8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.vm{display:flex;gap:10px;font-size:13px;color:var(--muted);margin-top:5px;flex-wrap:wrap}
.vm .vv{color:#e2b8ff;font-weight:700}
.vd{font-size:12px;color:var(--muted);margin-top:2px}
.skelv{cursor:default}.skelv .vth{border:0}
dialog.player{width:min(960px,94vw);max-width:none;padding:14px}
.pl-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.pl-frame{position:relative;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:#000}
.pl-frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
@media (max-width:760px){
  .ytvh{grid-template-columns:auto minmax(0,1fr) auto}
  .ytvstats{grid-column:1/-1;grid-row:2;justify-content:space-between;gap:10px}
  .ytvstats div{align-items:flex-start}
  .vgrid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .vid{padding:4px}
}
.ytchip{display:inline-flex;flex-direction:column;align-items:flex-start;gap:1px;border:1px solid var(--line);background:#0d0818;color:var(--ink);font:inherit;font-size:13px;padding:6px 11px;border-radius:10px;cursor:pointer;transition:border-color .15s,background .15s,transform .12s}
.ytchip span{font-size:12px;color:var(--muted)}
.ytchip:hover{border-color:#a43dff88}
.ytchip:active{transform:scale(.96)}
.ytchip.on{border-color:var(--brand);background:#a43dff2e;box-shadow:0 0 0 1px #a43dff66,0 0 14px #a43dff44}
.ytchip.on span{color:#e2b8ff}
.tag.fall{background:#7f1d1d55;color:#fca5a5;border:1px solid #ef444466}
tr.fallrow td{opacity:.8}
.card.lk.fall{border-color:#ef444455;background:linear-gradient(160deg,#2a0f18,#140a14)}
.card.lk.fall .amt{color:#fbbf24}
.falltxt{font-size:12px;color:#fca5a5;margin-top:2px}
.cofre h3 small{color:#fbbf24}
.cofre-link{display:inline-block;margin:4px 0 14px;padding:8px 14px;border-radius:999px;border:1px solid rgba(251,191,36,.35);background:rgba(251,191,36,.08);color:#fbbf24;text-decoration:none;font-size:14px}
.cofre-link:hover{background:rgba(251,191,36,.16)}
.fall-list{display:grid;gap:10px;max-height:50vh;overflow:auto}
.fall-it{display:flex;gap:10px;align-items:flex-start;padding:10px;border:1px solid #ef444444;border-radius:12px;background:#2a0f1866}
dialog.fallmodal{width:min(520px,94vw)}
input.ro{opacity:.75;cursor:not-allowed;border-style:dashed}
@media (min-width:1300px){ .ytlist{grid-template-columns:repeat(auto-fill,minmax(640px,1fr))} }
@media (max-width:760px){
  .yt{grid-template-columns:auto minmax(0,1fr) auto;gap:10px}
  .yt-days{grid-column:2/3;grid-row:2}
  .yt-st{grid-column:1/-1;grid-row:3}
  .yt-acts{grid-column:3;grid-row:1/3}
}
/* mapa de links */
.mp-f{display:flex;flex-direction:column;gap:8px;margin-top:14px;padding:12px 14px}
.mp-bar{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.mp-bar .lbl{font-size:12px;color:var(--muted);width:96px;flex:none;text-transform:uppercase;letter-spacing:.4px}
.mp-bar .btn{border-radius:999px;padding:4px 11px;font-size:13px}
.mp-bar .btn.on{background:var(--brand-soft);border-color:var(--brand);color:#fff;box-shadow:var(--glow)}
.mp-bar .btn .c{opacity:.6;font-size:11px;margin-left:5px}
.lc{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.5px;padding:1px 5px;border-radius:5px;background:#ffffff14;color:#d9c9f5;margin-right:5px;vertical-align:1px}
.mp-sum{font-size:13px;color:var(--muted);margin:12px 2px 0}
.mp-sum b{color:var(--ink)} .mp-sum .g{color:#4ade80} .mp-sum .r{color:#f87171}
.mp-grp{margin-top:12px;padding:0;overflow:hidden}
.mp-gh{display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer;user-select:none}
.mp-gh:hover{background:#ffffff06}
.mp-gh .t{font-weight:700}
.mp-gh .m{margin-left:auto;font-size:12px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.mp-gh .m .g{color:#4ade80} .mp-gh .m .r{color:#f87171}
.mp-grp .chev{transition:transform .15s;display:inline-block;color:var(--muted)}
.mp-grp.open .chev{transform:rotate(90deg)}
.mp-rows{border-top:1px solid var(--line)}
.mr{display:grid;grid-template-columns:150px 1fr;gap:12px;padding:10px 14px;border-top:1px solid #ffffff08;border-left:3px solid transparent;align-items:center}
.mr:first-child{border-top:0}
.mr-n{font-weight:700;font-size:14px;white-space:nowrap}
.mr-n a{display:block;font-weight:400;font-size:11px;color:var(--muted);text-decoration:none;overflow:hidden;text-overflow:ellipsis}
.mr-n a:hover{color:var(--brand-hi)}
.mr.livre{border-left-color:#22c55e;background:linear-gradient(90deg,#22c55e14,transparent 60%)}
.mr.livre .mr-n{color:#86efac}
.mr.uso{background:#ffffff03}
.mr.uso .mr-n{color:#cfc6dd}
.mr.morto{border-left-color:#ef4444}
.mr.ocupado{background:#ffffff03}
.mr.ocupado .mr-n{color:#8f86a3}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;white-space:nowrap}
.pill.g{background:#0f2a1c;color:#4ade80;border:1px solid #22c55e55}
.pill.r{background:#3a1220;color:#f87171}
.pill.y{background:#2b240c;color:#facc15}
.pill.n{background:#ffffff0d;color:var(--muted)}
.mc-list{display:flex;flex-direction:column;gap:6px;min-width:0}
.mc{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center;font-size:13px}
.mc .who{display:flex;gap:6px;align-items:center;flex-wrap:wrap;min-width:0}
.mc .v{color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums;text-align:right}
.mc .v b{color:var(--ink)}
.mc.dead .v b{color:#f87171}
.mc .acts{display:flex;gap:6px;align-items:center;justify-content:flex-end;min-width:96px}
.mr .note{font-size:12px;color:var(--muted)}
.mp-pop ul{margin:10px 0 0;padding-left:18px}
.mp-pop li{margin:3px 0}
@media (max-width:640px){
  .mr{grid-template-columns:1fr;gap:6px}
  .mc{grid-template-columns:1fr;row-gap:4px;padding:6px 0;border-top:1px dashed #ffffff10}
  .mc:first-child{border-top:0;padding-top:0}
  .mc .v{text-align:left}
  .mc .acts{justify-content:flex-start;min-width:0}
  .mp-bar{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
  .mp-bar .btn{flex:none}
  .mp-bar .lbl{width:auto}
  .mp-gh .m{display:none}
}

let api;
const S = { user: null, view: "", preset: "mes", start: "", end: "", loginErr: "", loginTab: "employee", loginUser: "", setup: false, sheetDate: today(), sheet: [], imp: null, ocr: [], team: [], links: [], mgrLinks: {}, myMgrLinks: {}, myTeam: [], myTeamPct: null, openCards: new Set(), openEmp: new Set(), openEquipe: new Set(), yt: null, ytv: {}, ytvOpen: new Set(), ytBusy: new Set(), ytFil: "all", ytAll: null, mp: null, mpBusy: new Set(), mpRun: null, foldTeam: (() => { try { return localStorage.getItem("hy_fold_team") === "1"; } catch (_) { return false; } })() };
const PRESETS = [["hoje", "Hoje"], ["ontem", "Ontem"], ["7d", "7 dias"], ["mes", "Este mês"], ["mesp", "Mês passado"], ["custom", "Personalizado"]];
function setPreset(p) {
  const t = today(); S.preset = p;
  if (p === "hoje") S.start = S.end = t;
  else if (p === "ontem") S.start = S.end = addDays(t, -1);
  else if (p === "7d") { S.start = addDays(t, -6); S.end = t; }
  else if (p === "mes") { S.start = t.slice(0, 8) + "01"; S.end = t; }
  else if (p === "mesp") { const d = fromYmd(t.slice(0, 8) + "01"); d.setDate(0); S.end = ymd(d); S.start = S.end.slice(0, 8) + "01"; }
}

/* admin: guarda a lista dos Social Networks ocupados (só nomes) para gerentes e equipe verem como ocupado */
async function publishTaken(links) {
  if (!S.user || S.user.role !== "admin") return;
  const list = [...new Set(links.filter(l => l.active !== false).map(l => norm(l.name)).filter(Boolean))].sort();
  try {
    if (S.takenPub == null) S.takenPub = JSON.stringify([...(await api.getTaken())].sort());
    if (S.takenPub === JSON.stringify(list)) return;
    await api.setTaken(list); S.takenPub = JSON.stringify(list);
  } catch (e) { console.warn("Não foi possível salvar os links ocupados:", e); }
}
async function loadTeam() {
  const [emps, links, ml] = await Promise.all([api.listEmployees(), api.listLinks(), api.listMgrLinks()]);
  emps.sort((a, b) => a.name.localeCompare(b.name, "pt-BR"));
  links.sort((a, b) => (a.channel || "").localeCompare(b.channel || "", "pt-BR") || a.name.localeCompare(b.name, "pt-BR"));
  for (const e of emps) e.links = links.filter(l => l.empId === e.empId);
  S.team = emps; S.links = links; S.mgrLinks = Object.fromEntries(ml.map(m => [m.id, m])); regLinks(links);
  publishTaken(links);
  const changed = await syncMgrLinks();
  /* uma vez por sessão: garante que os lançamentos do mês atual usam a dedução de impostos/sócios */
  if (!S.taxSynced) { S.taxSynced = true; await recalcMonthAdmin(S.links.map(l => l.id)); }
  else if (changed.length) await recalcMonthAdmin(changed);
  return emps;
}
const teamPct = mgr => mgr && typeof mgr.teamPercent === "number" ? mgr.teamPercent : null;
const linkById = id => S.links.find(l => l.id === id);
const empById = id => S.team.find(e => e.empId === id);
/* gerente que vale para os links deste funcionário (precisa ser gerente ativo) */
function effMgr(empId) {
  const e = empById(empId); if (!e || !e.managerId || e.managerId === empId) return null;
  const m = empById(e.managerId); return m && m.isManager && m.active !== false ? m : null;
}
/* mantém a lista de links que cada gerente administra (mgrLinks) igual ao cadastro */
async function syncMgrLinks() {
  const jobs = [], changed = [];
  for (const l of S.links) {
    const mgr = effMgr(l.empId), cur = S.mgrLinks[l.id], e = empById(l.empId);
    if (!mgr) { if (cur) { jobs.push(api.setMgrLink(l.id, null)); delete S.mgrLinks[l.id]; } continue; }
    /* nos links da equipe, a % do link é sempre a % do gerente na equipe */
    const tp = teamPct(mgr);
    if (tp != null && l.percent !== tp) { l.percent = tp; jobs.push(api.saveLink({ ...l })); changed.push(l.id); }
    const want = { mgrId: mgr.empId, empId: l.empId, empName: e ? e.name : "", name: l.name, channel: l.channel || "", url: l.url || "", icon: l.icon || "",
      active: l.active !== false && (!e || e.active !== false), ownerPercent: l.percent,
      empPercent: cur && cur.mgrId === mgr.empId ? Math.min(cur.empPercent || 0, l.percent) : 0 };
    if (l.sameAs) want.sameAs = l.sameAs;
    if (l.fallen) want.fallen = l.fallen;
    if (!cur || Object.keys(want).some(k => cur[k] !== want[k]) || (cur.sameAs || "") !== (l.sameAs || "") || (cur.fallen || "") !== (l.fallen || "")) { jobs.push(api.setMgrLink(l.id, want)); S.mgrLinks[l.id] = { id: l.id, ...want }; }
  }
  for (const id of Object.keys(S.mgrLinks)) if (!linkById(id)) { jobs.push(api.setMgrLink(id, null)); delete S.mgrLinks[id]; }
  await Promise.all(jobs);
  return changed;
}
/* monta o lançamento de um link já com a divisão funcionário/gerente */
function opFor(link, date, cents) {
  const mgr = effMgr(link.empId), m = S.mgrLinks[link.id], ok = mgr && m && m.mgrId === mgr.empId;
  return { empId: link.empId, linkId: link.id, date, amountCents: cents, percent: link.percent,
    mgrId: ok ? mgr.empId : null, empPercent: ok ? Math.min(m.empPercent || 0, link.percent) : null };
}
/* refaz os lançamentos do mês atual destes links com a % e o gerente de agora (meses anteriores não mudam) */
async function recalcMonthAdmin(linkIds) {
  if (!linkIds.length) return 0;
  const earn = await api.getEarnings(monthStart(), today()), set = new Set(linkIds);
  const ops = earn.filter(x => set.has(x.linkId) && linkById(x.linkId)).map(x => ({ x, o: opFor(linkById(x.linkId), x.date, x.amountCents) }))
    .filter(({ x, o }) => { const sp = splitShares(o.amountCents, o.percent, o.mgrId, o.empPercent);
      return x.taxPercent !== taxPctFor(o.date) || x.netCents !== o.amountCents || grossOf(x) !== o.amountCents || taxCentsOf(x) !== taxOf(o.amountCents, o.date) || x.percent !== o.percent || (x.mgrId || null) !== o.mgrId || x.shareCents !== sp.emp || (x.mgrShareCents || 0) !== sp.mgr; })
    .map(({ o }) => o);
  if (ops.length) await api.writeEarnings(ops);
  return ops.length;
}

/* cor do funcionário (escolhida no cadastro) */

const chPill = (channel, icon, color) => { const c = safeColor(color);

/* links "reaproveitados": mesmo Social Network usado em outro canal (sameAs = id do link original). O valor entra só no original. */
const REG = new Map();

  return chPill(l.channel, l.icon, c) + (l.sameAs ? "" : sibPills(l, c)); };
/* canal que caiu: o link fica parado (sem uso, livre) e o dinheiro que ele já ganhou fica no "cofrinho" do funcionário */
const fallTag = l => l && l.fallen ? ` <span class="tag fall" title="Canal caiu em ${fmtDate(l.fallen)}. O dinheiro dele fica no cofrinho.">⚠ canal caiu ${fmtDate(l.fallen).slice(0, 5)}</span>` : "";

async function makeIcon(file) {

  const side = Math.min(img.width, img.height), g = c.getContext("2d"); g.imageSmoothingQuality = "high";

  if (!S.user) { app.innerHTML = banner + (S.setup ? setupHTML() : loginHTML()); return; }

  const tabs = admin ? [["painel", "Painel"], ["lancar", "Lançar ganhos"], ["equipe", "Funcionários e links"], ["cofre", "🐷 Cofrinho"], ["mapa", "Mapa de links"], ["ytv", "Canais do YouTube"], ["yt", "Conferir postagem"]]

    <div class="wrap enter" id="main">${SKEL}</div>`;
  ({ painel: viewPainel, lancar: viewLancar, equipe: viewEquipe, meus: viewMeus, time: viewTime, cofre: viewCofre, yt: viewYt, ytv: viewYtv, mapa: viewMapa })[S.view]().then(() => {

/* números dos cartões sobem de 0 até o valor (só no navegador, sem "reduzir movimento") */
function animateNums(root) {
  if (!window.matchMedia || matchMedia("(prefers-reduced-motion: reduce)").matches || !window.requestAnimationFrame) return;
  for (const el of $$(".kpi .val", root)) {
    const txt = el.textContent, m = txt.match(/^(-?)R\$\s?([\d.]+),(\d{2})$/); if (!m) continue;
    const cents = (m[1] ? -1 : 1) * (parseInt(m[2].replace(/\./g, ""), 10) * 100 + parseInt(m[3], 10)); if (!cents) continue;
    const t0 = performance.now(), dur = 900;
    const step = now => { if (!document.contains(el)) return; const k = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - k, 3);
      el.textContent = k < 1 ? brl(Math.round(cents * e)) : txt; if (k < 1) requestAnimationFrame(step); };
    el.textContent = brl(0); requestAnimationFrame(step);
  }
}

function chartHTML(valByDay, title) {
  const days = []; for (let d = S.start; d <= S.end; d = addDays(d, 1)) days.push(d);
  if (days.length < 2 || days.length > 92) return "";
  const max = Math.max(1, ...days.map(d => valByDay[d] || 0));
  return `<div class="card sec"><h3>${title}</h3><div class="chart">${days.map(d => {
    const v = valByDay[d] || 0;

  }).join("")}</div><div class="chartx"><span>${fmtDate(days[0])}</span><span>${fmtDate(days[days.length - 1])}</span></div></div>`;

    const e = byEmp[x.empId] || (byEmp[x.empId] = { ...blank(), links: {} }); add(e, x);
    add(e.links[x.linkId] || (e.links[x.linkId] = blank()), x);

    const c = byCh[ck] || (byCh[ck] = { ...blank(), name: chName, icon: "", emps: new Set(), fall: l && l.fallen ? l : null }); add(c, x); if (l && l.icon && !c.icon) c.icon = l.icon;

/* canal caiu: o link nunca fica "pausado".
   - se o mesmo Social Network tem outro canal vivo (reaproveitado), o link e o dinheiro continuam nele; só fica registrado que esse canal caiu;
   - se era o último canal do link, o link fica livre de novo (Mapa de links) e tudo que ele rendeu fica no cofrinho, preso a este registro.
     Quem usar o mesmo Social Network depois começa do zero, num link novo. */
async function setFallen(l, on) {
  const admin = S.user.role === "admin", me = S.user.empId;
  const all = admin ? await api.listLinks() : [...await api.listMgrLinks(me), ...(await api.myLinks(me)).map(x => ({ ...x, empId: me }))];
  const cur = all.find(x => x.id === l.id) || l;
  const save = async (x, patch) => { const full = all.find(y => y.id === x.id) || x;
    if (admin) await api.saveLink({ ...full, ...patch });
    else if (full.empId === me) await api.mgrSaveOwnLink({ ...full, ...patch }, me);
    else await api.mgrSaveLink({ ...full, ...patch, id: full.id }, me); };
  if (!on) return save(cur, { active: true, fallen: "" });
  const nome = cur.channel || l.channel || "";
  if (!cur.sameAs) {
    const vivo = all.find(x => x.sameAs === cur.id && !x.fallen && x.active !== false);
    if (vivo) { /* o link (com o dinheiro) passa a ser do canal que está vivo; o registro do outro guarda o canal que caiu */
      await save(cur, { channel: vivo.channel || "", icon: vivo.icon || "" });
      await save(vivo, { channel: nome, icon: cur.icon || "", active: false, fallen: today() });
      const yts = await api.listYt(admin ? null : me).catch(() => []);
      for (const y of yts) { if (y.linkId === cur.id) await api.saveYt(y.id, { linkId: vivo.id }); else if (y.linkId === vivo.id) await api.saveYt(y.id, { linkId: cur.id }); }
      return;
    }
  }
  await save(cur, { active: false, fallen: today(), ...(nome && !cur.channel ? { channel: nome } : {}) });
}
async function askFallen(l, who, after) {

const YT_API = "https://www.googleapis.com/youtube/v3/";
function parseYtUrl(u) {
  u = String(u || "").trim();
  if (/^UC[\w-]{22}$/.test(u)) return { id: u };
  if (/^@[\w.\-]{2,}$/.test(u)) return { handle: u };

  if (!/(^|\.)youtube\.com$/i.test(url.hostname)) return null;
  const p = url.pathname.split("/").filter(Boolean).map(decodeURIComponent);
  if (p[0] && p[0].startsWith("@")) return { handle: p[0] };
  if (p[0] === "channel" && /^UC[\w-]{22}$/.test(p[1] || "")) return { id: p[1] };
  if (p[0] === "user" && p[1]) return { user: p[1] };
  if (p[0] === "c" && p[1]) return { handle: "@" + p[1] };
  return null;
}
const ytHref = c => { const p = parseYtUrl(c.url); return p ? (p.id ? `https://www.youtube.com/channel/${p.id}` : p.handle ? `https://www.youtube.com/${encodeURIComponent(p.handle).replace("%40", "@")}` : `https://www.youtube.com/user/${encodeURIComponent(p.user)}`) : ""; };

    if (reason === "keyInvalid" || /API key not valid/i.test((j.error && j.error.message) || "")) throw new Error("A chave da API do YouTube é inválida.");
    if (r.status === 403) throw new Error("A chave não tem permissão para a API do YouTube.");

}
function ytAgo(iso) {

const MP_LANGS = { de: ["DE", "Alemão", "Alemanha"], it: ["IT", "Italiano", "Itália"], pt: ["BR", "Português", "Brasil"], pl: ["PL", "Polonês", "Polônia"],
  fr: ["FR", "Francês", "França"], en: ["US", "Inglês", "Estados Unidos"], es: ["ES", "Espanhol", "Espanha"] };
/* planilha DECLANHPS: número do Social Network, idioma e link de promoção */
const MP_CATALOG = [
  [1, "de", "https://robux.com.de/npQrKP"], [2, "it", "https://robux.agency/Rx3rDm"], [3, "de", "https://robux.com.de/Xis7gJ"], [4, "it", "https://robux.agency/KjNMG6"],
  [5, "pt", "https://robux.agency/bt9BVy"], [6, "pl", "https://robux.agency/yZLnoj"], [7, "de", "https://robux.com.de/iscvTi"], [8, "it", "https://robux.agency/ywswBl"],
  [9, "fr", "https://robux.agency/37Dxsf"], [10, "en", "https://robux.agency/FhKQDn"], [11, "en", "https://robux.agency/lefdeG"], [12, "es", "https://robux.agency/uo6mlf"],
  [13, "en", "https://robux.agency/d7YVj4"], [14, "it", "https://robux.agency/B9MaoY"], [15, "de", "https://robux.com.de/u6oyGs"], [16, "es", "https://robux.agency/LrtVaU"],
  [17, "it", "https://robux.agency/xVTqO3"], [18, "de", "https://robux.com.de/I4bFq0"], [19, "en", "https://robux.agency/OQtzGY"], [20, "es", "https://robux.agency/aZB9Tj"]];
/* link morto: os vídeos postados nos últimos MP_DIAS dias, somados, têm menos de MP_MIN_VIEWS views */
const MP_DIAS = 3, MP_MIN_VIEWS = 10000, MP_VALIDADE = 6 * 3600e3, MP_VELHO = 24 * 3600e3;
const mpNum = s => { const m = String(s || "").match(/social\s*network\s*(\d+)/i); return m ? +m[1] : null; };
const MP_CACHE = "hy_v3";
const mpCache = () => { try { return JSON.parse(localStorage.getItem(MP_CACHE) || "{}") || {}; } catch (_) { return {}; } };
const mpCacheSet = (id, v) => { try { const o = mpCache(); o[id] = v; localStorage.setItem(MP_CACHE, JSON.stringify(o)); } catch (_) {} };
/* resultado mais novo do teste de views: o salvo no canal ou o guardado neste aparelho */
const v3Of = (c, cache) => { const a = c.v3, b = (cache || mpCache())[c.id]; return a && b ? (a.at >= b.at ? a : b) : a || b || null; };

/* soma as views dos vídeos postados nos últimos MP_DIAS dias */
async function ytViews3d(c, key) {
  const since = Date.now() - MP_DIAS * 86400e3;
  if (api.mode === "demo") {
    await new Promise(r => setTimeout(r, 300));
    let h = 3; for (const ch of c.id + today()) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
    return { at: Date.now(), views: h % 3 === 0 ? h % 9000 : 10000 + h % 90000, n: 1 + h % 6, best: null };
  }
  if (!key) throw new Error("Falta cadastrar a chave da API do YouTube.");
  let uploads = c.uploads;
  if (!uploads) {
    const q = { part: "snippet,contentDetails" };
    if (c.channelId) q.id = c.channelId; else { const p = parseYtUrl(c.url); if (!p) throw new Error("Endereço do canal inválido."); if (p.id) q.id = p.id; else if (p.handle) q.forHandle = p.handle; else q.forUsername = p.user; }
    const j = await ytGet("channels", q, key), ch = j.items && j.items[0];
    if (!ch) throw new Error("Canal não encontrado. Confira o endereço em Conferir postagem.");
    uploads = ch.contentDetails.relatedPlaylists.uploads;
    const patch = { channelId: ch.id, uploads, thumb: ((ch.snippet.thumbnails || {}).default || {}).url || c.thumb || "" };
    Object.assign(c, patch); api.saveYt(c.id, patch).catch(() => {});
  }
  const pj = await ytGet("playlistItems", { part: "contentDetails", playlistId: uploads, maxResults: "50" }, key);
  const ids = (pj.items || []).filter(it => it.contentDetails.videoPublishedAt && new Date(it.contentDetails.videoPublishedAt).getTime() >= since).map(it => it.contentDetails.videoId);
  let views = 0, best = null;
  for (let i = 0; i < ids.length; i += 50) {
    const vj = await ytGet("videos", { part: "snippet,statistics", id: ids.slice(i, i + 50).join(",") }, key);
    for (const v of vj.items || []) { const n = +((v.statistics || {}).viewCount || 0); views += n; if (!best || n > best.views) best = { id: v.id, title: v.snippet.title || "", views: n }; }
  }
  return { at: Date.now(), views, n: ids.length, best };
}

/* junta a planilha com os links cadastrados e os canais do YouTube; cada canal tem o próprio teste */
function mpBuild() {
  const Y = S.yt, P = id => Y.people.find(p => p.empId === id), cache = mpCache(), now = Date.now();
  const acc = new Map();
  for (const [n, lang, promo] of MP_CATALOG) acc.set("n" + n, { key: "n" + n, n, name: `Social Network ${n}`, lang, promo, links: [] });
  for (const l of (Y.links || []).filter(l => !l.fallen)) {
    const n = mpNum(l.name), k = n != null ? "n" + n : "x" + norm(l.name);
    if (!acc.has(k)) acc.set(k, { key: k, n, name: n != null ? `Social Network ${n}` : l.name, lang: "", promo: "", links: [], extra: true });
    acc.get(k).links.push(l);
  }
  const out = [...acc.values()];
  for (const a of out) {
    a.paused = a.links.filter(l => l.active === false);
    a.lines = [];
    for (const l of a.links.filter(l => l.active !== false)) {
      const p = P(l.empId), chs = Y.chs.filter(c => c.linkId === l.id || (!c.linkId && l.channel && norm(c.title) === norm(l.channel)));
      if (!chs.length) { a.lines.push({ l, p, c: null, name: l.channel || l.name, st: "nochan" }); continue; }
      for (const c of chs) {
        const v = v3Of(c, cache), fresh = v && now - v.at < MP_VELHO;
        const st = S.mpBusy.has(c.id) ? "run" : c.v3err && !fresh ? "err" : !v ? "none" : v.views >= MP_MIN_VIEWS ? "ok" : fresh ? "dead" : "none";
        a.lines.push({ l, p, c, v, name: c.title || l.channel || l.name, st });
      }
    }
    /* gerente: link usado fora da equipe dele aparece só como ocupado, sem dizer quem usa */
    const fora = !a.lines.length && !Y.admin && (Y.taken || []).includes(norm(a.name));
    a.st = fora ? "ocupado" : !a.lines.length ? "livre" : a.lines.some(x => x.st === "dead") ? "morto" : "uso";
  }
  return out.sort((x, y) => (x.n == null) - (y.n == null) || (x.n || 0) - (y.n || 0) || x.name.localeCompare(y.name, "pt-BR"));
}

const MP_LS = "hy_mp";
function mpState() {
  if (S.mp) return S.mp;

  S.mp = { lang: "all", emp: "all", fil: "all", closed: new Set(Array.isArray(o.closed) ? o.closed : []) };
  return S.mp;
}

async function mpRunTest(force) {
  const Y = S.yt; if (!Y || S.mpRun) return;
  if (api.mode !== "demo" && !Y.key) { if (force) toast(Y.admin ? "Cadastre a chave da API do YouTube em Conferir postagem → ⚙ API." : "O administrador ainda precisa ativar o teste (chave da API do YouTube).", true); return; }
  const cache = mpCache(), chs = [...new Map(mpBuild().flatMap(a => a.lines).filter(x => x.c).map(x => [x.c.id, x.c])).values()];
  const ids = chs.filter(c => { const v = v3Of(c, cache); return force || !v || Date.now() - v.at > MP_VALIDADE; }).map(c => c.id).filter(id => !S.mpBusy.has(id));
  if (!ids.length) { if (force) toast("Nenhum canal do YouTube ligado aos links em uso."); return; }
  ids.forEach(id => S.mpBusy.add(id)); S.mpRun = { done: 0, total: ids.length }; renderMapa();
  let fatal = null;
  const one = async id => {
    const c = Y.chs.find(x => x.id === id);
    try {
      if (!c || fatal) return;
      const v3 = await ytViews3d(c, Y.key); c.v3 = v3; delete c.v3err; mpCacheSet(c.id, v3);
      api.saveYt(c.id, { v3 }).catch(() => {});
    } catch (e) { if (c) c.v3err = msgErro(e); if (/cota|chave/i.test(msgErro(e))) fatal = msgErro(e); }
    finally { S.mpBusy.delete(id); if (S.mpRun) S.mpRun.done++; renderMapa(); }
  };
  const queue = [...ids];
  await Promise.all(Array.from({ length: Math.min(3, queue.length) }, async () => { while (queue.length) await one(queue.shift()); }));
  S.mpRun = null; renderMapa();
  if (fatal) toast(fatal, true);
  else if (force) { const n = mpBuild().flatMap(a => a.lines).filter(x => x.st === "dead").length; toast(n ? `${n} ${n === 1 ? "canal morto" : "canais mortos"}.` : "Nenhum canal morto.", n > 0); }
  mpPopup();
}

  }).join("");
  const nFree = all.filter(a => a.st === "livre").length, nDead = all.flatMap(a => a.lines).filter(x => x.st === "dead").length, R = S.mpRun;

    <div class="card mp-f">

      <div class="mp-bar"><span class="lbl">Mostrar</span>${[["all", "Tudo"], ["livre", "Só disponíveis"], ["uso", "Só em uso"], ["morto", "Só mortos"]].map(([f, l]) => chip("mpFil", f, M.fil === f, l, ofLE(M.lang, M.emp, f))).join("")}</div>
    </div>
    <div class="mp-sum"><b>${all.length}</b> links · <span class="g">${nFree} disponíveis</span> · ${all.length - nFree} em uso${nDead ? ` · <span class="r">${nDead} ${nDead === 1 ? "canal morto" : "canais mortos"}</span>` : ""}</div>
    ${blocks || `<div class="card empty sec">Nenhum link nesse filtro.</div>`}

  editLink(el) {
    const l = linkById(el.dataset.l), f = teamPct(effMgr(l.empId)); let changed = false;
    const hasSibs = S.links.some(x => x.sameAs === l.id), others = S.links.filter(x => x.empId === l.empId && x.id !== l.id && !x.sameAs), cands = hasSibs ? [] : others;
    openForm({ title: "Editar link", fields: [...reuseFields(cands, l), ...linkFields(l, f)], onOpen: reuseOpen(cands, f != null ? null : "percent", x => x.percent),
      onSubmit: d => { checkDupLink(d, others, (empById(l.empId) || {}).name || "Esse funcionário"); const nd = linkData(d, f); changed = nd.percent !== l.percent;
        return api.saveLink({ ...l, ...nd, sameAs: d.sameAs != null ? d.sameAs : l.sameAs || "" }); } })
      .then(ok => ok && (changed ? afterTeamChange([l.id], "Link salvo.") : viewEquipe()));
  },
  async toggleLink(el) { const l = linkById(el.dataset.l); try { await api.saveLink({ ...l, active: l.active === false }); await viewEquipe(); } catch (e) { toast(msgErro(e), true); } },
  delLink(el) {
    const l = linkById(el.dataset.l);
    openForm({ title: "Excluir link", text: `Excluir “${linkLabel(l)}”? Para só parar de usar, prefira Pausar.`, submitLabel: "Excluir",
      fields: [{ name: "withEarnings", type: "checkbox", value: true, label: "Apagar também o dinheiro já lançado neste link", hint: "Desmarcado: os valores continuam nos totais como “link removido”." }],
      onSubmit: d => api.deleteLink(l, !!d.withEarnings) }).then(ok => ok && viewEquipe());
  }
};
document.addEventListener("click", e => {
  for (const d of $$("details.menu[open]")) if (!d.contains(e.target) || (e.target.closest(".pop") && e.target.closest("[data-act]"))) d.open = false;
  const el = e.target.closest("[data-act]"); if (!el) return;
  if (el.tagName === "A") e.preventDefault();
  Promise.resolve(ACT[el.dataset.act](el)).catch(err => toast(msgErro(err), true));
});
document.addEventListener("input", e => {
  if (e.target.matches("input.money[data-k]")) { e.target.classList.remove("filled"); sheetTotals(); }
  if (e.target.matches("input.pctin")) {
    const m = S.myMgrLinks[e.target.dataset.ml], v = parsePercent(e.target.value), out = $(`[data-left="${CSS.escape(e.target.dataset.ml)}"]`);
    if (m && out) out.textContent = v == null || v > m.ownerPercent ? `use de 0% a ${pct(m.ownerPercent)}` : `de ${pct(m.ownerPercent)} · você fica com ${pct(m.ownerPercent - v)}`;
  }
});
document.addEventListener("paste", e => {
  if (!$("#ocrDrop")) return;
  const it = [...(e.clipboardData ? e.clipboardData.items : [])].find(i => i.type.startsWith("image/"));
  if (it) { e.preventDefault(); runOcr(it.getAsFile()); }
});
document.addEventListener("dragover", e => { const d = e.target.closest && e.target.closest("#ocrDrop"); if (d) { e.preventDefault(); d.classList.add("over"); } });
document.addEventListener("dragleave", e => { const d = e.target.closest && e.target.closest("#ocrDrop"); if (d) d.classList.remove("over"); });
document.addEventListener("drop", e => { const d = e.target.closest && e.target.closest("#ocrDrop"); if (d) { e.preventDefault(); d.classList.remove("over"); runOcr(e.dataTransfer.files[0]); } });
document.addEventListener("change", async e => {
  if (e.target.dataset && e.target.dataset.chg === "showTax") {
    try { await api.updateEmployee(e.target.dataset.u, { showTax: e.target.checked }); toast(e.target.checked ? "Ele agora vê o faturamento bruto e os impostos." : "Impostos ocultos para ele."); }
    catch (err) { toast(msgErro(err), true); e.target.checked = !e.target.checked; }
    return;
  }
  if (e.target.dataset && e.target.dataset.chg === "setMgr") {
    const u = e.target.dataset.u;
    try { await api.updateEmployee(u, { managerId: e.target.value || null }); await afterTeamChange(S.links.filter(l => l.empId === u).map(l => l.id), "Equipe atualizada."); } catch (err) { toast(msgErro(err), true); }
    return;
  }
  if (e.target.id === "ocrFile" && e.target.files[0]) { runOcr(e.target.files[0]); e.target.value = ""; return; }
  if (e.target.id === "sheetDate" && e.target.value) { S.sheetDate = e.target.value > today() ? today() : e.target.value; viewLancar(); }
  if (e.target.id === "impFile" && e.target.files[0]) {
    try { S.imp = await lerPlanilha(e.target.files[0]); renderImport(); } catch (err) { $("#impOut").innerHTML = `<p class="err">${esc(msgErro(err))}</p>`; }
  }
});
/* A pré-visualização do app bloqueia o envio de formulários, então
   os botões e a tecla Enter chamam esta função diretamente. */
const AUTH_FORMS = ["fLogin", "fSetup", "fFirst"];
document.addEventListener("submit", e => { if (AUTH_FORMS.includes(e.target.id)) { e.preventDefault(); enviarAuth(e.target); } });
document.addEventListener("keydown", e => {
  const f = e.target.closest && e.target.closest("form");
  if (e.key === "Enter" && f && AUTH_FORMS.includes(f.id) && e.target.tagName === "INPUT") { e.preventDefault(); enviarAuth(f); }
});
let enviando = false;
async function enviarAuth(f) {
  if (enviando) return;
  const d = Object.fromEntries(new FormData(f)), btn = $("button.primary", f);
  enviando = true; btn.disabled = true; S.loginErr = "";
  try {
    checkRequired(f);
    if (f.id === "fLogin") { S.loginUser = d.username; await api.signIn(userKey(d.username), d.password, S.loginTab); }
    else if (f.id === "fSetup") {
      const username = d.username.trim().toLowerCase();
      if (!USER_RE.test(username)) throw new Error("Usuário inválido: use de 3 a 30 letras, números, ponto, hífen ou _, sem espaços nem acentos.");
      checkNewPassword(d.password, d.confirm);
      await api.setupAdmin({ name: d.name.trim(), username, password: d.password }); S.setup = false;
    } else {
      checkNewPassword(d.password, d.confirm);
      await api.finishFirstPassword(d.password); S.user.mustChangePassword = false; toast("Senha criada. Bem-vindo!"); render();
    }
  } catch (err) { S.loginErr = msgErro(err); render(); }
  finally { enviando = false; if (document.contains(btn)) btn.disabled = false; }
}

/* ========================= início ========================= */
(async function start() {
  document.title = NOME_DO_SITE;
  try {
    api = FIREBASE_CONFIG ? await makeFirebaseApi(FIREBASE_CONFIG) : makeDemoApi();
    if (api.mode === "firebase") S.setup = await api.needsSetup();
  } catch (e) {
    console.error(e); $("#app").innerHTML = `<div class="wrap"><div class="card"><b>Não foi possível conectar ao Firebase.</b><p class="err">${esc(msgErro(e))}</p></div></div>`; return;
  }
  api.init((user, err) => {
    S.user = user;
    if (err !== undefined) S.loginErr = err;
    if (user) { S.loginErr = ""; S.setup = false; }
    render();
  });
})();
</script>
